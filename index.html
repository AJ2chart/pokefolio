<style>
:root{
  --bg:#0f1117;--bg2:#161a23;--card:#1c212c;--card2:#232937;--line:#2c3342;
  --text:#e9ecf2;--muted:#8b93a7;--accent:#ffcb05;--accent-ink:#ffcb05;--accent2:#e3350d;--ok:#3ecf8e;--ko:#ff5d5d;

}
[data-theme=light]{
  --bg:#f4f5f8;--bg2:#ffffff;--card:#ffffff;--card2:#f0f2f6;--line:#e1e4ea;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,svg,canvas,video{max-width:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:23px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.logo svg{width:38px;height:38px;flex:none}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}

nav a.active{color:#1a1d24;background:var(--accent)}
.hactions{display:flex;gap:6px;align-items:center}
#accBtn{position:relative}
html[data-priv] .money,html[data-priv] .tile .row,html[data-priv] .alerts{display:none!important}
.sumbar.safe{justify-content:space-between;align-items:center;gap:10px;flex-wrap:nowrap;color:var(--muted)}
.sumbar.safe .safe-tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumbar.safe .btn{flex:none;min-height:34px}
#privBtn.on{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}#accBtn .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
#accBtn .dot.ok{background:var(--ok)}#accBtn .dot.syncing{background:var(--accent)}#accBtn .dot.error{background:var(--ko)}
.stat.wbudget{display:flex;flex-direction:column;width:fit-content;min-width:min(100%,300px);max-width:100%;margin:0 0 18px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.stat.wbudget .val{color:var(--accent-ink);font-size:30px}
.stat.wbudget .lbl{color:var(--text);font-weight:500}
.credit{color:var(--muted);font-size:12px;margin:28px 0 4px;text-align:center}
.credit a{color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.sumbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.sumbar:hover{border-color:var(--muted)}
.sumbar .sb-v b{font-size:18px}
.sumbar .sb-chk{margin-left:auto;padding:3px 9px;border-radius:999px;background:rgba(255,176,32,.14);color:#ffb020;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.sumbar .sb-chk:hover{background:rgba(255,176,32,.24)}
.sumbar .sb-chk+.sb-go{margin-left:0}
@media (max-width:379px){.sumbar .sb-chk-l{display:none}}
@media (max-width:719px){
.sumbar.sb-b{display:grid;grid-template-columns:1fr auto;grid-template-areas:"v go" "g chk";column-gap:10px;row-gap:4px}
.sumbar.sb-b .sb-v{grid-area:v;display:flex;flex-direction:column;gap:2px}
.sumbar.sb-b .sb-lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.sumbar.sb-b .sb-v b{font-size:24px;line-height:1.15}
.sumbar.sb-b .sb-g{grid-area:g}
.sumbar.sb-b .sb-chk{grid-area:chk;margin:0;justify-self:end}
.sumbar.sb-b .sb-go{grid-area:go;margin:0;align-self:start;justify-self:end}
.sumbar.sb-b .sb-chk-l{display:inline!important}
}
.sumbar .sb-go{margin-left:auto;display:inline-flex;align-items:center;gap:2px;color:var(--muted);font-size:13px;white-space:nowrap}
.lflag{display:inline-block;position:relative;width:16px;height:11px;margin-right:6px;vertical-align:-1px;border-radius:2px;overflow:hidden}.lflag svg{width:100%;height:100%;display:block}
#ptr{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));z-index:25;transform:translate(-50%,-60px);opacity:0;display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;box-shadow:var(--shadow);pointer-events:none;transition:opacity .15s;white-space:nowrap}
#ptr .ptr-ic{display:inline-block;transition:transform .15s;color:var(--accent-ink);font-weight:700}
#ptr.busy{opacity:1;transition:transform .2s}
#ptr.busy .ptr-ic{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;font-size:0}
.coll-head{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.coll-head .tbtitle{flex:1 1 auto}
.btn-sm{padding:7px 12px;font-size:14px;gap:6px}
.cfilters{display:flex;gap:10px;align-items:center;margin:0 0 14px}
.cf-row{display:flex;gap:8px;flex:1 1 auto;min-width:0}
.searchbox{position:relative;flex:1;min-width:0;display:block}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchbox input[type=text]{padding-left:38px}
.btn.cf-toggle{display:none;position:relative}
.langseg{display:inline-flex;margin:0 0 12px}
.scanbox input[type=text]{padding-right:52px}
.scanbox .scanic{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:42px;height:38px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.scanbox .scanic:hover{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.scanbox .scanic svg{position:static;transform:none;color:inherit}
.afilters .cf-panel{align-items:center}
.af-reset{white-space:nowrap;font-size:13.5px}
.more-sentinel{display:flex;justify-content:center;min-height:40px;padding:14px}
.tile .img{position:relative}
.qadd{position:absolute;z-index:2;right:4px;bottom:4px;width:var(--pill);height:var(--pill);border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;background:rgba(14,16,22,.9);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 2px 6px rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);-webkit-tap-highlight-color:transparent;transition:transform .12s,background .15s,color .15s}
.qadd::before{content:'';position:absolute;inset:-8px;border-radius:50%}
.qadd svg{width:var(--pillic);height:var(--pillic);display:block}
.qadd .qa-ok{display:none}
@media (hover:hover){.qadd:hover{background:#ffcb05;color:#1a1d24}}
.qadd:active{transform:scale(.88)}.qadd.busy{opacity:.55}
.qadd.done{background:#3ecf8e;color:#0f1117;box-shadow:0 2px 6px rgba(0,0,0,.35)}.qadd.done .qa-plus{display:none}.qadd.done .qa-ok{display:block}
.ah-t{font-size:15px;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 0;text-decoration:underline}
.ah-sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.ah-set{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font:inherit;font-size:14px}
.ah-set img{height:18px;width:auto}
.ah-set:hover{border-color:var(--accent)}
.ah-logo{display:none}
/* Ajouter on computers (layout A): centred page, bigger set tiles with the set logo */
@media (min-width:721px){
  #main[data-view=add]{max-width:1040px}
  #main[data-view=add] .add-top{max-width:none}
  #main[data-view=add] .ah-sets{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  #main[data-view=add] .ah-set{padding:12px;font-size:14.5px}
  #main[data-view=add] .ah-logo{display:flex;align-items:center;justify-content:center;width:100%;height:64px;margin-bottom:8px;border-radius:9px;background:var(--card2)}
  #main[data-view=add] .ah-logo img{max-height:46px;max-width:86%;height:auto;width:auto;object-fit:contain}
  #main[data-view=add] .ah-logo.mg img{width:38px;height:38px}
  #main[data-view=add] .ah-set:has(.ah-logo) .ah-sym{display:none}
}
.sheet-cta{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px 24px;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);border-radius:0 0 18px 18px}
.cta-wish{gap:7px}.cta-wish svg{width:20px;height:20px;flex:none}
.cta-wish.on{color:var(--accent2);opacity:1}.cta-wish.on svg path{fill:currentColor}
.sh-wish>span{display:inline-flex;align-items:center;gap:7px}.sh-wish>span svg{width:17px;height:17px}.sh-wish>span svg path{fill:currentColor}
body:has(#ov .sheet-cta) .toast{bottom:90px}
.sh{display:grid;grid-template-columns:320px 1fr;gap:28px;padding:26px 26px 8px}
.sh-hero{position:relative;align-self:start;position:sticky;top:0;padding-top:4px}
.sh-imgw{position:relative;border-radius:14px;background:radial-gradient(70% 60% at 50% 45%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 72%)}
.sh-img{width:100%;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.5);cursor:zoom-in;display:block}
.sh-zoom{position:absolute;right:-8px;bottom:-8px;width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:rgba(14,16,22,.9);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 2px 6px rgba(0,0,0,.4)}
.sh-name{margin:2px 40px 8px 0;font-size:24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sh-flag svg{width:22px;height:15px;border-radius:2px;display:block}
.sh-chips{display:flex;flex-wrap:wrap;gap:6px}
.sh-chip{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.sh-chip.r{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.sh-illu{font-size:12.5px;color:var(--muted);margin-top:8px}
.sh-price{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 4px;margin-top:14px}
.sh-price.safe{padding:14px;color:var(--muted);font-size:14px}
.sh-plab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sh-prow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.sh-pval{font-size:30px;font-weight:700;line-height:1.15;margin-top:2px}
.sh-pchg{font-size:13px;font-weight:600}
.sh-prange{font-size:12.5px;color:var(--muted);margin-top:4px}
.spark{flex:none;margin-bottom:4px}
.sh-pdet{margin-top:10px;border-top:1px solid var(--line)}
.sh-pdet summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;cursor:pointer;font-size:14px}
.sh-pdet summary::-webkit-details-marker{display:none}
.sh-pdet summary>span::after{content:' ▾';color:var(--muted)}
.sh-pdet[open] summary>span::after{content:' ▴'}
.sh-pdet-in{padding-bottom:10px}
.sh-links{display:flex;gap:14px}
.sh-links a{color:var(--muted);text-decoration:none;font-size:13.5px}
.sh-links a:hover{color:var(--text)}
.sh-wish{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent2) 10%,var(--card));border:1px solid color-mix(in srgb,var(--accent2) 30%,var(--line));font-size:14px}
.sh-wish>span{color:var(--accent2);font-weight:600;white-space:nowrap}.sh-wish .linkbtn{white-space:nowrap}
.sh-wish .linkbtn{text-decoration:none;color:var(--text);font-size:13.5px}
.sh-sec{margin:22px 0 10px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.sh-lbl{font-size:13px;color:var(--muted);margin:14px 0 7px}
.sh-seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.sh-seg button{flex:1;padding:9px 6px;border-radius:9px;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.sh-seg button.on{background:var(--card2);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.sh-pills{display:flex;gap:6px}
.sh-pills button{flex:1;min-width:0;padding:9px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.sh-pills button.on{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent);color:var(--accent-ink)}
.sh-cdesc{font-size:12.5px;color:var(--muted);margin-top:7px}
.sh-step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.sh-step button{width:46px;height:42px;border:0;background:none;color:var(--text);font-size:20px;cursor:pointer}
.sh-step input[type=number]{width:52px;text-align:center;border:0;background:none;font-weight:700;font-size:16px;padding:0;-moz-appearance:textfield;box-shadow:none}
.sh-step input::-webkit-inner-spin-button,.sh-step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sh-form details.extra{margin-top:10px;padding:11px 14px;border-radius:12px;background:var(--card)}
.sh-form details.extra summary{font-size:14px}
.sh-copy{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.sh-copy.focus,.sh-copy.open{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.sh-copy .q{min-width:36px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:14px}
.sh-copy .t{flex:1;min-width:0}
.sh-copy .t>div:first-child{font-weight:600;font-size:14.5px}
.sh-copy .t>div+div{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
