<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gleamvault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<meta name="theme-color" content="#0f1117">
<meta name="description" content="Suivi de collection Pokémon TCG : cartes FR/EN, prix Cardmarket, scan, alertes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gleamvault">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f1117;--bg2:#161a23;--card:#1c212c;--card2:#232937;--line:#2c3342;
  --text:#e9ecf2;--muted:#8b93a7;--accent:#ffcb05;--accent2:#e3350d;--ok:#3ecf8e;--ko:#ff5d5d;
  --shadow:0 6px 24px rgba(0,0,0,.35);--r:14px;
}
[data-theme=light]{
  --bg:#f4f5f8;--bg2:#ffffff;--card:#ffffff;--card2:#f0f2f6;--line:#e1e4ea;
  --text:#1a1d24;--muted:#69718a;--accent:#d9a400;--accent2:#d12f0b;--ok:#13a36a;--ko:#d93636;
  --shadow:0 6px 24px rgba(20,30,60,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,svg,canvas,video{max-width:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:23px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.logo svg{width:38px;height:38px;flex:none}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
nav a:hover{color:var(--text);background:var(--card2)}
nav a.active{color:#1a1d24;background:var(--accent)}
.hactions{display:flex;gap:6px;align-items:center}
#accBtn{position:relative}#accBtn .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
#accBtn .dot.ok{background:var(--ok)}#accBtn .dot.syncing{background:var(--accent)}#accBtn .dot.error{background:var(--ko)}
.stat.wbudget{display:flex;flex-direction:column;margin:0 0 18px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.stat.wbudget .val{color:var(--accent);font-size:30px}
.stat.wbudget .lbl{color:var(--text);font-weight:500}
.spanel{max-width:820px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:0 0 14px;overflow:hidden}
.shead{display:flex;align-items:center;gap:10px;font-size:15px;margin:0;padding:13px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--card2) 55%,var(--card))}
.shead svg{width:18px;height:18px;color:var(--accent);flex:none}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 18px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.sinfo{min-width:0}
.stitle{font-weight:500;overflow-wrap:anywhere}
.sdesc{color:var(--muted);font-size:13px;margin-top:2px}
.sctl{flex:none}
.snote{margin:0;padding:12px 18px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.credit{color:var(--muted);font-size:12px;margin:28px 0 4px;text-align:center}
.credit a{color:var(--muted)}
.about .ab-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.about .ab-logo svg{width:44px;height:44px;display:block}
.about .ab-name{font-weight:700;font-size:17px}
.ab-list{margin:0;padding:6px 18px}
.ab-list>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ab-list>div:last-child{border-bottom:0}
.ab-list dt{color:var(--muted)}
.ab-list dd{margin:0;text-align:right}
.ab-list a{color:var(--text)}
.ab-legal{margin:0;padding:12px 18px 16px;font-size:11.5px;line-height:1.55;color:var(--muted);border-top:1px solid var(--line)}
.pdemo{display:inline-grid;place-items:center;border-radius:999px;background:var(--accent);color:#1a1d24;font-weight:700;line-height:1;margin-right:6px}
.pd-s{width:15px;height:15px;font-size:9px}.pd-m{width:19px;height:19px;font-size:11px}.pd-l{width:25px;height:25px;font-size:13.5px}
.pwdwrap{position:relative;display:block}.pwdwrap input{padding-right:44px}
.pwdeye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;display:grid;place-items:center}.pwdeye:hover{color:var(--text)}
.acc-av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#1a1d24;font-weight:700;font-size:12px;display:grid;place-items:center}
.flag{border:2px solid transparent;border-radius:5px;padding:0;width:28px;height:20px;cursor:pointer;background:none;overflow:hidden;opacity:.55;display:flex}
.flag svg{width:100%;height:100%}
.flag.on{opacity:1;border-color:var(--accent)}
.iconbtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
main{max-width:1280px;margin:0 auto;padding:22px 20px 80px}
h1{font-size:24px;margin:6px 0 16px}
h2{font-size:18px;margin:26px 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat .lbl{color:var(--muted);font-size:13px}
.stat .val{font-size:26px;font-weight:700;margin-top:4px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--ko)}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#1a1d24;border-color:var(--accent)}
.btn.danger{color:var(--ko)}
.btn:disabled{opacity:.5;cursor:default}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.toolbar .grow{flex:1;min-width:220px}
.tbtitle{margin:0;flex:1 1 auto;min-width:max-content;white-space:nowrap}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.bigsearch{font-size:17px;padding:13px 16px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--card2);color:var(--text)}
.seg svg{width:17px;height:12px;border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative}
.tile:hover{transform:translateY(-3px);border-color:var(--accent)}
.tile .img{aspect-ratio:63/88;border-radius:8px;overflow:hidden;background:var(--card2);display:grid;place-items:center}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .nm{font-weight:600;margin-top:8px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.tile .price{font-weight:700}
:root{--pill:19px;--pillfs:11px;--pillic:13px;--pillx:10px}
html[data-pill=s]{--pill:15px;--pillfs:9px;--pillic:10px;--pillx:8px}
html[data-pill=l]{--pill:25px;--pillfs:13.5px;--pillic:17px;--pillx:13px}
.badge{position:absolute;top:14px;left:14px;z-index:2;background:var(--accent);color:#1a1d24;border-radius:999px;font-size:var(--pillfs);font-weight:700;line-height:1;min-width:var(--pill);height:var(--pill);padding:0 calc(var(--pill)*.27);display:grid;place-items:center;box-shadow:0 0 0 2px var(--card),0 1px 4px rgba(0,0,0,.35)}
.wbtn{position:absolute;top:14px;right:14px;z-index:2;width:var(--pill);height:var(--pill);border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;background:color-mix(in srgb,var(--bg) 78%,transparent);color:var(--text);box-shadow:0 0 0 1px var(--line),0 1px 4px rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent;transition:transform .12s}
.wbtn svg{width:var(--pillic);height:var(--pillic);margin-top:1px}
.wbtn::before{content:'';position:absolute;inset:-10px;border-radius:50%}
.wbtn:active{transform:scale(.9)}
.wbtn.on{color:var(--accent2)}
.wbtn.on svg path{fill:currentColor}
.wbtn.busy{opacity:.6}
.xbtn svg{width:var(--pillx);height:var(--pillx);margin:0}
.xbtn:hover{color:var(--ko)}
.tile.has-x .lbadge{right:calc(20px + var(--pill))}
.toast{display:flex;align-items:center;gap:14px;width:max-content;max-width:min(90vw,460px)}
.toast-act{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:2px 0;white-space:nowrap}
.lbadge{position:absolute;z-index:2;top:15px;right:14px;width:18px;height:13px;border-radius:2px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.lbadge svg{width:100%;height:100%;display:block}
.tile .img{position:relative}
.gbadge{position:absolute;bottom:8px;left:8px;background:#1a1d24;color:#fff;border:1px solid var(--accent);border-radius:6px;font-size:12px;font-weight:700;padding:2px 7px}
details.extra{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details.extra summary{cursor:pointer;font-size:13px;color:var(--text);font-weight:500}
.noimg{color:var(--muted);font-size:12px;text-align:center;padding:10px}
.empty{text-align:center;padding:50px 20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
details.fold{padding:0}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;user-select:none;-webkit-tap-highlight-color:transparent}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary b{white-space:nowrap}
.fold .pv{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
details.fold[open] .pv{visibility:hidden}
.fold .chev{flex:none;color:var(--muted);transition:transform .2s}
details.fold[open] .chev{transform:rotate(180deg)}
.fold .fbody{padding:0 18px 14px}
.list .li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .li:last-child{border-bottom:0}
.list img{width:38px;border-radius:4px}
.list .grow{flex:1;min-width:0}
.list .grow div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,8,15,.65);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:18px;max-width:980px;width:100%;box-shadow:var(--shadow);position:relative}
.modal.sm{max-width:440px}
.mclose{position:absolute;top:12px;right:12px}
.mbody{display:grid;grid-template-columns:340px 1fr;gap:24px;padding:24px}
.mbody .cimg{width:100%;border-radius:14px;box-shadow:var(--shadow)}
.mpad{padding:24px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:10px 0}
.kv span:nth-child(odd){color:var(--muted)}
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pbox .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.pbox .v{font-weight:700;font-size:16px}
.range{background:color-mix(in srgb,var(--accent) 14%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:12px;padding:12px 14px;margin:10px 0}
.range b{font-size:20px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form .full{grid-column:1/-1}
.links{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.notice{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:14px}
canvas{max-width:100%}
.chartbox{position:relative;height:340px}
@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .mbody{grid-template-columns:1fr}
  .mbody .cimg{max-width:300px;margin:0 auto;display:block}
  .prices{grid-template-columns:repeat(2,1fr)}
  .hwrap{flex-wrap:wrap}
  nav{order:3;flex-basis:100%}
}
.tabbar{display:none}
@media (max-width:720px){
  header nav#nav{display:none}
  .hwrap{flex-wrap:nowrap;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right))}
  .logo{font-size:21px;gap:9px}.logo svg{width:33px;height:33px}
  .hactions{margin-left:auto;gap:5px}
  .flag{width:25px;height:18px;border-width:1.5px;border-radius:4px}
  .iconbtn{width:36px;height:36px}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{position:relative;flex:none}
  main{flex:1 1 auto;min-height:0;width:100%;max-width:100vw;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:14px 12px 24px;padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right))}
  .tabbar{display:flex;position:relative;flex:none;z-index:30;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px calc(4px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500;padding:5px 0;border-radius:10px;-webkit-tap-highlight-color:transparent}
  .tabbar a svg{width:23px;height:23px}
  .tabbar a:hover{background:none;color:var(--muted)}
  .tabbar a.active,.tabbar a.active:hover{color:var(--accent);background:none}
  h1{font-size:21px;margin:4px 0 12px}
  h2{font-size:17px}
  .stats{gap:10px}.stat{padding:12px 14px;box-shadow:none}.stat .val{font-size:21px}.stat .sub{font-size:11px}
  .panel{padding:14px;box-shadow:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid>*,.stats>*,.two>*,.form>*,.prices>*,.toolbar>*{min-width:0}
  .ov{overflow-x:hidden}.modal{max-width:100vw;overflow-x:hidden}
  .kv span{overflow-wrap:anywhere}
  input[type=date]{min-width:0;width:100%;-webkit-appearance:none;appearance:none}
  .tile{padding:7px}.tile:hover{transform:none}.tile .nm{font-size:14px}
  html[data-pill=m]{--pill:18px;--pillfs:10.5px}
  .badge{top:10px;left:10px}
  .wbtn{top:10px;right:10px}.lbadge{top:12px;right:11px}
  .tile.has-x .lbadge{right:calc(18px + var(--pill))}
  .toolbar{gap:8px}
  .toolbar .grow{min-width:100%;flex-basis:100%}
  .toolbar select{flex:1 1 40%;min-width:0;max-width:none!important;width:auto!important}
  .tbtitle{flex:1 1 100%}
  input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{font-size:16px}
  .btn{min-height:42px;justify-content:center}
  #scanLbl{flex:1 1 100%}
  .ov{padding:0;align-items:flex-start}
  .modal{border-radius:0;min-height:100%;border:0;max-width:none}
  .ov:has(.modal.sm){align-items:flex-end;background:rgba(5,8,15,.55)}
  .modal.sm{border-radius:18px 18px 0 0;min-height:0;padding-bottom:env(safe-area-inset-bottom)}
  .mbody{padding:16px;gap:14px;padding-top:calc(56px + env(safe-area-inset-top))}
  .mbody .cimg{max-width:230px}
  .mclose{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:5}
  .modal.sm .mclose{position:absolute;top:12px}
  .mpad{padding:18px}
  .mbody h1{font-size:20px}
  .form{grid-template-columns:1fr}
  .links .btn{flex:1 1 100%}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .chartbox{height:260px}
  .kv{font-size:13px}
  .srow{flex-direction:column;align-items:stretch;gap:10px;padding:12px 14px}
  .sctl .btn,.sctl label.btn{width:100%}
  .sctl .seg{display:flex}.sctl .seg button{flex:1;justify-content:center}
  .shead{padding:12px 14px}.snote{padding:10px 14px}
}
</style>
</head>
<body>
<header>

async function loadIndex(lang,force){
  if(idx[lang]&&!force)return idx[lang];
  if(loading[lang]&&!force)return loading[lang];
  loading[lang]=(async()=>{
    const cached=!force&&await idb.get('index_'+lang);
    if(cached&&Date.now()-cached.ts<INDEX_TTL){idx[lang]=cached;return cached}
    try{
      const [cards,sets,pocket]=await Promise.all([getJSON(`${API}/${lang}/cards`),getJSON(`${API}/${lang}/sets`),getJSON(`${API}/${lang}/series/tcgp`).catch(()=>({sets:[]}))]);
      const excl=new Set((pocket.sets||[]).map(s=>s.id));
      const setMap={};sets.forEach((s,i)=>{if(!excl.has(s.id))setMap[s.id]={id:s.id,n:s.name,o:i,off:s.cardCount?.official,tot:s.cardCount?.total,sym:s.symbol||''}});
      const list=[];
      for(const c of cards){
        const sid=c.id.slice(0,c.id.length-String(c.localId).length-1);
        if(excl.has(sid)||!setMap[sid])continue;
        list.push({id:c.id,n:c.name,l:String(c.localId),s:sid,i:c.image||''});
      }
      const data={ts:Date.now(),cards:list,sets:setMap};
      await idb.set('index_'+lang,data);idx[lang]=data;return data;
    }catch(e){if(cached){idx[lang]=cached;return cached}loading[lang]=null;throw e}
  })();
  return loading[lang];
}

/* ============ pricing ============ */
function pickPrice(pricing,variant,hasNormal){
  const cm=pricing?.cardmarket;
  if(!cm)return null;
  const useHolo=(variant==='reverse'||(variant==='holo'&&hasNormal))&&(cm['trend-holo']>0||cm['avg7-holo']>0);
  const f=k=>{const v=cm[useHolo?k+'-holo':k];return v==null||v===0?null:v};
  const p={trend:f('trend'),low:f('low'),avg1:f('avg1'),avg7:f('avg7'),avg30:f('avg30'),updated:cm.updated};
  // robust estimate: median of trend + sales averages (Cardmarket's trend alone can be erratic on cheap/reverse cards)
  const vals=[p.trend,p.avg1,p.avg7,p.avg30].filter(v=>v>0).sort((a,b)=>a-b);
  p.value=vals.length?(vals.length%2?vals[(vals.length-1)/2]:(vals[vals.length/2-1]+vals[vals.length/2])/2):p.low;
  if(p.value!=null)p.value=Math.round(p.value*100)/100;
  return p.value==null?null:p;
}
function priceRange(p){
  if(!p)return null;
  const vals=[p.avg1,p.avg7,p.avg30,p.trend].filter(v=>v>0);
  if(!vals.length)return null;
  return {min:Math.min(...vals),max:Math.max(...vals)};
}

/* ============ snapshots ============ */
function totals(list=collection.filter(e=>e.status!=='wish')){
  let value=0,count=0,cost=0,costBase=0,valueWithCost=0,withCost=0;
  for(const e of list){
    const v=entryValue(e)||0;value+=v*e.qty;count+=e.qty;
    if(e.buy>0){cost+=e.buy*e.qty;valueWithCost+=v*e.qty;withCost++}
  }
  return{value,count,cost,gain:valueWithCost-cost,gainPct:cost?((valueWithCost-cost)/cost*100):null,withCost,unique:list.length};
}
function takeSnapshot(){
  const tt=totals();const d=today();
  const s={d,value:+tt.value.toFixed(2),cost:+tt.cost.toFixed(2),count:tt.count};
  const i=snapshots.findIndex(x=>x.d===d);
  if(i>=0)snapshots[i]=s;else snapshots.push(s);
  snapshots.sort((a,b)=>a.d.localeCompare(b.d));
  LS.set('pf_snapshots',snapshots);
}
function pushHistory(e){
  if(e.price?.value==null)return;
  e.hist=e.hist||[];const d=today();
  const i=e.hist.findIndex(h=>h.d===d);
  if(i>=0)e.hist[i].v=e.price.value;else e.hist.push({d,v:e.price.value});
  if(e.hist.length>400)e.hist=e.hist.slice(-400);
}
function change7(e){
  if(!e.hist||e.hist.length<2||e.price?.value==null)return null;
  const target=Date.now()-7*864e5;let ref=null;
  for(const h of e.hist){if(new Date(h.d).getTime()<=target)ref=h}
  if(!ref)ref=e.hist[0];
  if(ref.d===today()||!ref.v)return null;
  return (e.price.value-ref.v)/ref.v*100;
}

let refreshing=false;
async function refreshPrices(silent){
  if(refreshing||!collection.length)return;
  refreshing=true;
  const keys=[...new Set(collection.map(e=>e.lang+':'+e.cardId))];
  let done=0;const btn=document.getElementById('refreshBtn');
  const upd=()=>{if(btn){btn.disabled=true;btn.innerHTML=`<span class="spin"></span> ${t('refreshing',{p:done,t:keys.length})}`}};
  upd();
  const queue=[...keys];let failed=0;
  async function worker(){
    while(queue.length){
      const k=queue.shift();const[lang,...rest]=k.split(':');const id=rest.join(':');
      try{
        delete detailCache[k];
        const d=await getDetail(lang,id);
        for(const e of collection.filter(x=>x.lang===lang&&x.cardId===id)){
          const p=pickPrice(d.pricing,e.variant,d.variants?.normal);
          e.price=p;e.tcp=d.pricing?.tcgplayer||null;pushHistory(e);
        }
      }catch(err){failed++}
      done++;upd();
    }
  }
  await Promise.all(Array.from({length:6},worker));
  settings.lastRefresh=Date.now();saveSettings();saveCollection();
  refreshing=false;
  const hits=checkAlerts(false);
  if(hits.length){toast('🔔 '+t('alert_toast',{n:hits.length}));try{if('Notification' in window&&Notification.permission==='granted')hits.forEach(e=>new Notification('Gleamvault',{body:t('alert_msg',{n:e.name,v:fmtEur(entryValue(e))})}))}catch(_){}}
  else if(!silent||failed)toast(failed?t('err_net'):t('saved'));
  render();
}

const SCRYDEX_SET={'30th':'me55','30th-c':'me55c'};
// sets whose numbering differs on Scrydex: explicit localId → number map, unknown cards get no fallback
const SCRYDEX_NUM={'30th-c':{'001':'4','002':'5','003':'11','004':'11g','005':'18','006':'19','007':'25','008':'33','009':'41','010':'43','011':'47','012':'50','013':'57','014':'58','015':'69','016':'85','017':'89','018':'94','019':'99','020':'100','021':'101','022':'106p','023':'106m','024':'106','025':'108','026':'114','027':'123','028':'138','029':'149','030':'203'}};
function scrydexId(setId,localId){
  if(!setId||!localId)return null;
  if(SCRYDEX_NUM[setId]){const n=SCRYDEX_NUM[setId][localId];return n?SCRYDEX_SET[setId]+'-'+n:null}
  let s=SCRYDEX_SET[setId];
  if(!s){const m=/^([a-z]+)0*(\d+)(\.5)?([a-z]*)$/i.exec(setId);s=m?m[1]+m[2]+(m[3]?(m[1]==='sm'?'5':'pt5'):'')+m[4]:setId}
  const l=/^\d+$/.test(localId)?String(parseInt(localId,10)):localId;
  return s+'-'+l;
}

}

function mergeData(local,remote){

  const map=new Map();

    if(!e||!e.uid||(del[e.uid]&&del[e.uid]>=tsOf(e)))continue;
    const cur=map.get(e.uid);

  const snaps=new Map();for(const s of[...(remote.snapshots||[]),...(local.snapshots||[])])snaps.set(s.d,s);
  const limit=Date.now()-120*864e5;for(const k of Object.keys(del))if(del[k]<limit)delete del[k];

  return `<div class="pillset">${label?`<div class="small muted" style="margin-bottom:6px">${t('pill_size')}</div>`:''}<div class="seg" role="radiogroup">${['s','m','l'].map(k=>`<button type="button" data-pill="${k}" class="${cur===k?'on':''}" role="radio" aria-checked="${cur===k}"><span class="pdemo pd-${k}">3</span>${t('pill_'+k)}</button>`).join('')}</div></div>`;
}
function bindPill(root){root.querySelectorAll('[data-pill]').forEach(b=>{if(b.tagName!=='BUTTON')return;b.onclick=()=>{settings.pill=b.dataset.pill;saveSettings();document.documentElement.dataset.pill=settings.pill;root.querySelectorAll('button[data-pill]').forEach(x=>{const on=x.dataset.pill===settings.pill;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)})}})}
function openAccount(){
  if(!sb){const m=openModal(`<div class="mpad"><h2 style="margin-top:0">${t('account')}</h2><p>${t('sb_unavailable')}</p></div>`,'sm');return}
  if(user){
    const m=openModal(`<div class="mpad"><h2 style="margin:0 40px 6px 0">${t('account')}</h2>
      <p class="muted">${esc(user.email)}</p><p id="syncInfo">${syncLabel()}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn primary" id="aSync">↻ ${t('sync_now')}</button><button class="btn" id="aOut">${t('logout')}</button></div>
      <h3 style="margin:22px 0 10px;font-size:15px">${t('display')}</h3>${pillControl()}</div>`,'sm');
    bindPill(m);
    m.querySelector('#aSync').onclick=()=>syncNow();
    m.querySelector('#aOut').onclick=()=>{
      const m2=openModal(`<div class="mpad"><p style="margin:10px 30px 18px 0">${t('logout_q')}</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn" id="oKeep">${t('logout_keep')}</button><button class="btn danger" id="oWipe">${t('logout_wipe')}</button></div></div>`,'sm');
      const out=async wipe=>{await syncNow();await sb.auth.signOut();if(wipe){collection=[];snapshots=[];deleted={};LS.set('pf_collection',[]);LS.set('pf_snapshots',[]);LS.set('pf_deleted',{})}closeModal();toast(t('logged_out'));render()};
      m2.querySelector('#oKeep').onclick=()=>out(false);m2.querySelector('#oWipe').onclick=()=>out(true);
    };
    return;
  }
  const m=openModal(`<div class="mpad"><h2 style="margin:0 40px 6px 0">${t('account')}</h2><p class="muted small">${t('account_why')}</p>
    <form class="form" id="aForm" style="grid-template-columns:1fr">
      <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
      <label>${t('password')}${pwdField('pwd','current-password')}</label>
      <p id="aMsg" class="small" style="margin:0"></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit">${t('login')}</button><button class="btn" type="button" id="aUp">${t('signup')}</button></div>
      <button class="btn" type="button" id="aForgot" style="border:0;background:none;text-decoration:underline;padding:4px 0;justify-self:start">${t('forgot')}</button>
    </form></div>`,'sm');
  bindPwdToggles(m);
  const f=m.querySelector('#aForm'),msg=m.querySelector('#aMsg');
  const say=(x,ok)=>{msg.textContent=x;msg.style.color=ok?'var(--ok)':'var(--ko)'};
  f.onsubmit=async ev=>{ev.preventDefault();say('');
    if(!f.email.checkValidity()||!f.pwd.value){say(t('err_fields_login'));return}
    const{error}=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.pwd.value});
    if(error)say(authErr(error));else{closeModal();toast(t('logged_in'))}};
  m.querySelector('#aUp').onclick=async()=>{
    if(!f.email.checkValidity()||f.pwd.value.length<PWD_MIN){say(t('err_fields'));return}
    const{data,error}=await sb.auth.signUp({email:f.email.value.trim(),password:f.pwd.value,options:{emailRedirectTo:APP_URL}});
    if(error)say(authErr(error));else if(!data.session)say(t('check_mail'),true);else{closeModal();toast(t('logged_in'))}};
  m.querySelector('#aForgot').onclick=()=>openForgot(f.email.value.trim());
}
const PWD_MIN=8;
const EYE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7c2 0 3.8.7 5.2 1.6M22 12s-3.6 7-10 7c-2 0-3.8-.7-5.2-1.6"/><path d="M3 3l18 18"/></svg>';
function pwdField(name,ac){return `<span class="pwdwrap"><input type="password" name="${name}" autocomplete="${ac}" ${ac==='new-password'?`minlength="${PWD_MIN}"`:''}><button type="button" class="pwdeye" aria-label="${t('show_pwd')}" title="${t('show_pwd')}">${EYE}</button></span>`}
function bindPwdToggles(root){root.querySelectorAll('.pwdeye').forEach(b=>b.onclick=()=>{const i=b.previousElementSibling,show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?EYE_OFF:EYE;b.title=b.ariaLabel=t(show?'hide_pwd':'show_pwd');i.focus()})}
function openForgot(prefill){
  const m=openModal(`<div class="mpad"><h2 style="margin:0 40px 6px 0">${t('forgot_title')}</h2><p class="muted small">${t('forgot_why')}</p>
    <form class="form" id="fForm" style="grid-template-columns:1fr">
      <label>E-mail<input type="email" name="email" required autocomplete="email" value="${esc(prefill||'')}"></label>
      <p id="fMsg" class="small" style="margin:0"></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit">${t('forgot_send')}</button><button class="btn" type="button" id="fBack">${t('back')}</button></div>
    </form></div>`,'sm');
  const f=m.querySelector('#fForm'),msg=m.querySelector('#fMsg');
  setTimeout(()=>f.email.focus(),30);
  m.querySelector('#fBack').onclick=()=>openAccount();
  f.onsubmit=async ev=>{ev.preventDefault();
    if(!f.email.checkValidity()){msg.textContent=t('err_email');msg.style.color='var(--ko)';return}
    const btn=f.querySelector('[type=submit]');btn.disabled=true;
    const{error}=await sb.auth.resetPasswordForEmail(f.email.value.trim(),{redirectTo:APP_URL});
    btn.disabled=false;msg.textContent=error?authErr(error):t('reset_sent');msg.style.color=error?'var(--ko)':'var(--ok)'};
}
function openRecovery(){
  const m=openModal(`<div class="mpad"><h2 style="margin:0 40px 10px 0">${t('new_pwd')}</h2><form class="form" id="rForm" style="grid-template-columns:1fr">
    <label>${t('password')}${pwdField('pwd','new-password')}</label>
    <p id="rMsg" class="small" style="margin:0;color:var(--ko)"></p><div><button class="btn primary" type="submit">${t('save')}</button></div></form></div>`,'sm');
  bindPwdToggles(m);
  const f=m.querySelector('#rForm');
  f.onsubmit=async ev=>{ev.preventDefault();if(f.pwd.value.length<PWD_MIN){m.querySelector('#rMsg').textContent=t('err_pwd_len');return}
    const{error}=await sb.auth.updateUser({password:f.pwd.value});if(error)m.querySelector('#rMsg').textContent=authErr(error);else{closeModal();toast(t('saved'))}};
}

/* ============ view: collection ============ */
const cfilter={q:'',set:'',lang:''};
function viewCollection(m){
  const owned=collection.filter(e=>e.status!=='wish');
  const tt=totals(owned);
  const gainCls=tt.gain>=0?'pos':'neg';
  const sets=[...new Map(owned.map(e=>[e.lang+':'+e.setId,{k:e.setId,n:e.setName}])).values()];
  m.innerHTML=`
  <div class="stats">
    <div class="stat"><div class="lbl">${t('stat_value')}</div><div class="val">${fmtEur(tt.value)}</div><div class="sub">${settings.lastRefresh?t('updated_at',{d:fmtDate(settings.lastRefresh)}):''}</div></div>
    <div class="stat"><div class="lbl">${t('stat_cards')}</div><div class="val">${tt.count}</div><div class="sub">${t('unique_cards',{n:tt.unique})}</div></div>
    <div class="stat"><div class="lbl">${t('stat_cost')}</div><div class="val">${fmtEur(tt.cost)}</div><div class="sub">${t('gain_on',{n:tt.withCost})}</div></div>
    <div class="stat"><div class="lbl">${t('stat_gain')}</div><div class="val ${tt.withCost?gainCls:''}">${tt.withCost?(tt.gain>=0?'+':'')+fmtEur(tt.gain):'—'}</div><div class="sub ${gainCls}">${tt.withCost?fmtPct(tt.gainPct):''}</div></div>
  </div>
  ${alertsBanner(e=>e.status!=='wish')}
  ${owned.length?dashboardPanels(owned):''}
  <div class="toolbar" style="margin-top:26px">
    <h2 class="tbtitle">${t('my_collection')} <span class="muted small">(${tt.count})</span></h2>
    <button class="btn" id="refreshBtn" ${owned.length?'':'disabled'}>↻ ${t('refresh')}</button>
    <a class="btn primary" href="#add">＋ ${t('go_add')}</a>
  </div>
  ${owned.length?`
  <div class="toolbar">
    <input type="text" class="grow" id="cq" placeholder="${t('filter_collection')}" value="${esc(cfilter.q)}">
    <select id="cset" style="width:auto;max-width:240px"><option value="">${t('all_sets')}</option>${sets.sort((a,b)=>a.n.localeCompare(b.n)).map(s=>`<option value="${esc(s.k)}" ${cfilter.set===s.k?'selected':''}>${esc(s.n)}</option>`).join('')}</select>
    <select id="clang" style="width:auto"><option value="">${t('all_langs')}</option><option value="fr" ${cfilter.lang==='fr'?'selected':''}>Français</option><option value="en" ${cfilter.lang==='en'?'selected':''}>English</option></select>
    <select id="csort" style="width:auto">${['value','gain','added','name','set'].map(s=>`<option value="${s}" ${settings.sort===s?'selected':''}>${t('sort_'+s)}</option>`).join('')}</select>
  </div>
  <div class="grid" id="cgrid"></div>`:`<div class="empty"><p>${t('empty_collection')}</p><a class="btn primary" href="#add">＋ ${t('go_add')}</a></div>`}
  <p class="credit">${t('credit_short')} · <a href="#data">${t('about_more')}</a></p>`;
  const rb=m.querySelector('#refreshBtn');if(rb)rb.onclick=()=>refreshPrices();
  bindAlerts(m,e=>e.status!=='wish');
  m.querySelectorAll('details.fold').forEach(d=>d.addEventListener('toggle',()=>{settings.fold={...(settings.fold||{}),[d.dataset.k]:d.open};saveSettings()}));
  m.querySelectorAll('.alerts [data-open]').forEach(el=>el.onclick=()=>openEntry(el.dataset.open));
  if(!owned.length)return;
  const draw=()=>{
    const q=norm(cfilter.q);
    let list=owned.filter(e=>(!q||norm(e.name+' '+e.setName+' '+e.localId).includes(q))&&(!cfilter.set||e.setId===cfilter.set)&&(!cfilter.lang||e.lang===cfilter.lang));
    const s=settings.sort;
    list.sort((a,b)=>s==='name'?a.name.localeCompare(b.name):s==='added'?b.added-a.added:s==='set'?(a.setName.localeCompare(b.setName)||(parseInt(a.localId)||0)-(parseInt(b.localId)||0)):s==='gain'?gainOf(b)-gainOf(a):(entryValue(b)||0)*b.qty-(entryValue(a)||0)*a.qty);
    m.querySelector('#cgrid').innerHTML=list.map(entryTile).join('');
    m.querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>openEntry(el.dataset.uid));
  };
  m.querySelector('#cq').oninput=e=>{cfilter.q=e.target.value;draw()};
  m.querySelector('#cset').onchange=e=>{cfilter.set=e.target.value;draw()};
  m.querySelector('#clang').onchange=e=>{cfilter.lang=e.target.value;draw()};
  m.querySelector('#csort').onchange=e=>{settings.sort=e.target.value;saveSettings();draw()};
  draw();
  m.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openEntry(el.dataset.open));
}
// total copies of the same card (same card, same language, same list: owned or wishlist), across all entries
const copiesOf=e=>collection.reduce((n,x)=>x.cardId===e.cardId&&x.lang===e.lang&&(x.status==='wish')===(e.status==='wish')?n+(x.qty||1):n,0);
const gainOf=e=>e.buy>0&&entryValue(e)!=null?(entryValue(e)-e.buy)*e.qty:-Infinity;
function entryTile(e,opts={}){
  const v=entryValue(e);const ch=e.buy>0&&v!=null?(v-e.buy)/e.buy*100:null;
  return `<div class="tile ${opts.remove?'has-x':''}" data-uid="${e.uid}">
    ${(()=>{const n=copiesOf(e);return n>1?`<span class="badge" title="${esc(t('copies',{n}))}">${n}</span>`:''})()}<span class="lbadge">${FLAGS[e.lang]}</span>${opts.remove?`<button class="wbtn xbtn" data-x="${e.uid}" aria-label="${esc(t('wish_remove'))}" title="${esc(t('wish_remove'))}">${XICON}</button>`:''}
    <div class="img">${imgTag(e.image,e.setId,e.localId,e.name)}${e.grade?.co?`<span class="gbadge">${esc(gradeStr(e))}</span>`:''}</div>
    <div class="nm" title="${esc(e.name)}">${e.alert?`<span title="${t('alert')}">🔔 </span>`:''}${esc(e.name)}</div>
    <div class="meta">${esc(e.setName)} · ${esc(numLabel(e.localId,e.official))}${e.variant&&e.variant!=='normal'?' · '+t('v_'+e.variant):''}</div>
    <div class="row"><span class="price">${v!=null?fmtEur(v):'<span class="muted small">'+t('price_unavailable')+'</span>'}</span><span class="small ${ch>=0?'pos':'neg'}">${ch!=null?fmtPct(ch):''}</span></div>
  </div>`;
}
function dashboardPanels(owned){
  const top=[...owned].filter(e=>entryValue(e)!=null).sort((a,b)=>entryValue(b)-entryValue(a)).slice(0,5);
  const bySet={};for(const e of owned){const k=e.setName;bySet[k]=(bySet[k]||0)+(entryValue(e)||0)*e.qty}
  const sets=Object.entries(bySet).sort((a,b)=>b[1]-a[1]).slice(0,6);const max=sets[0]?.[1]||1;
  const movers=owned.map(e=>({e,c:change7(e)})).filter(x=>x.c!=null&&Math.abs(x.c)>=0.5).sort((a,b)=>Math.abs(b.c)-Math.abs(a.c)).slice(0,5);
  const li=(e,right)=>`<div class="li" data-open="${e.uid}"><span style="width:38px;flex:none">${imgTag(e.image,e.setId,e.localId,'')}</span><div class="grow"><div><b>${esc(e.name)}</b></div><div class="muted small">${esc(e.setName)} · ${esc(numLabel(e.localId,e.official))}</div></div>${right}</div>`;
  const fold=(k,title,preview,body)=>`<details class="panel fold" data-k="${k}" ${settings.fold?.[k]?'open':''}><summary><b>${title}</b><span class="pv">${preview}</span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></summary><div class="fbody">${body}</div></details>`;
  const topPv=top[0]?`${esc(top[0].name)} · ${fmtEur(entryValue(top[0]))}`:'';
  const sidePv=movers.length?`${esc(movers[0].e.name)} ${fmtPct(movers[0].c)}`:(sets[0]?`${esc(sets[0][0])} · ${fmtEur(sets[0][1])}`:'');
  return `<div class="two" style="margin-top:16px">
    ${fold('top',t('top_cards'),topPv,`<div class="list">${top.map(e=>li(e,`<b>${fmtEur(entryValue(e))}</b>`)).join('')||`<p class="muted small">—</p>`}</div>`)}
    ${fold('side',movers.length?t('movers'):t('by_set'),sidePv,movers.length?`<div class="list">${movers.map(x=>li(x.e,`<b class="${x.c>=0?'pos':'neg'}">${fmtPct(x.c)}</b>`)).join('')}</div>`
      :sets.map(([n,v])=>`<div style="margin-top:10px"><div style="display:flex;justify-content:space-between" class="small"><span>${esc(n)}</span><b>${fmtEur(v)}</b></div><div class="bar"><i style="width:${Math.max(2,v/max*100)}%"></i></div></div>`).join(''))}
  </div>`;
}

const search={q:'',set:'',page:1};
function viewAdd(m){
  const lang=settings.cardLang;
  m.innerHTML=`
  <h1>${t('add_title')}</h1>
  <div class="toolbar">
    <span class="muted small">${t('card_lang')}</span>
    <div class="seg" id="langSeg">${['fr','en'].map(l=>`<button data-l="${l}" class="${l===lang?'on':''}">${FLAGS[l]} ${l==='fr'?'Français':'English'}</button>`).join('')}</div>
    <span class="muted small" id="idxInfo"></span>
  </div>
  <div class="toolbar">
    <input type="text" class="grow bigsearch" id="sq" placeholder="${t('search_ph')}" value="${esc(search.q)}" autocomplete="off">
    <select id="sset" style="width:auto;max-width:280px"><option value="">${t('all_sets')}</option></select>
    <label class="btn primary" id="scanLbl" style="white-space:nowrap">📷 ${t('scan_btn')}<input type="file" id="scanInput" accept="image/*" hidden></label>
  </div>
  <div id="sres"></div>`;
  m.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>{settings.cardLang=b.dataset.l;saveSettings();search.set='';search.page=1;render()});
  const info=m.querySelector('#idxInfo'),res=m.querySelector('#sres'),sq=m.querySelector('#sq'),sset=m.querySelector('#sset');
  info.innerHTML=`<span class="spin"></span> ${t('loading_index',{l:t('lang_'+lang)})}`;
  setTimeout(()=>sq.focus(),30);
  loadIndex(lang).then(data=>{
    if(settings.cardLang!==lang||view!=='add')return;
    const sets=Object.values(data.sets).sort((a,b)=>b.o-a.o);

/* ============ scan (free OCR in the browser, Tesseract.js) ============ */
let ocrWorker=null,ocrLang=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
async function getOcr(lang){
  if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  const l=lang==='fr'?'fra':'eng';
  if(ocrWorker&&ocrLang===l)return ocrWorker;
  if(ocrWorker){try{await ocrWorker.terminate()}catch(_){}}
  ocrWorker=await Tesseract.createWorker(l);ocrLang=l;return ocrWorker;
}
function fileToImage(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
function cropCanvas(img,x0,x1,y0,y1,scale,filter='grayscale(1) contrast(1.7)'){
  const W=img.naturalWidth,H=img.naturalHeight,sw=(x1-x0)*W,sh=(y1-y0)*H,k=Math.min(scale,2400/sw);
  const c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  const x=c.getContext('2d');x.filter=filter;x.drawImage(img,x0*W,y0*H,sw,sh,0,0,c.width,c.height);return c;
}
function parseNumber(texts){
  for(const tx of texts){const m=/(\d[\d ]{0,4}?)\s*\/\s*(\d{2,3})(?!\d)/.exec(tx);if(m){const a=m[1].replace(/\s/g,'');if(+a>0&&+m[2]>=10)return a+'/'+m[2]}}
  for(const tx of texts){const m=/\b(TG|GG|SV|RC)\s?(\d{1,3})\b/i.exec(tx);if(m)return(m[1]+m[2].padStart(2,'0')).toUpperCase()}
  return null;
}
function matchName(text,data){
  const tx=' '+norm(text)+' ';
  if(!data.names){const s=new Set();for(const c of data.cards){if(!c.k)c.k=norm(c.n);s.add(c.k)}data.names=[...s].filter(n=>n.length>=3).sort((a,b)=>b.length-a.length)}
  let best=null;
  for(const n of data.names){
    let i=tx.indexOf(' '+n+' ');if(i<0&&n.length>=6&&!n.includes(' '))i=tx.indexOf(n);
    if(i<0)continue;
    if(/(olution|olue|olves|from)\w*\s*(de|d)?\s*$/.test(tx.slice(Math.max(0,i-18),i)))continue; // skip "Évolution de : X"
    if(!best||n.length>best.n.length||(n.length===best.n.length&&i<best.i))best={n,i};
  }
  return best?.n||null;
}
async function scanCard(file,data,lang,apply){
  const m=openModal(`<div class="mpad"><h2 style="margin:0 40px 12px 0">📷 ${t('scan_title')}</h2>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start"><img id="scanPrev" alt="" style="width:150px;border-radius:10px;background:var(--card2)">
    <div style="flex:1;min-width:180px"><p id="scanStatus"><span class="spin"></span> ${t('scan_loading')}</p><div id="scanOut" class="small"></div></div></div></div>`,'sm');
  const st=m.querySelector('#scanStatus'),outEl=m.querySelector('#scanOut');
  let img;try{img=await fileToImage(file);m.querySelector('#scanPrev').src=img.src}catch(e){st.textContent=t('import_bad');return}
  try{
    const w=await getOcr(lang);
    st.innerHTML=`<span class="spin"></span> ${t('scan_reading')}`;
    await w.setParameters({tessedit_char_whitelist:''});
    const top=(await w.recognize(cropCanvas(img,0,1,0,0.14,1.5))).data.text;
    await w.setParameters({tessedit_char_whitelist:'0123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZ '});
    const b1=(await w.recognize(cropCanvas(img,0,0.55,0.91,1,4))).data.text;
    const b2=(await w.recognize(cropCanvas(img,0.45,1,0.91,1,4))).data.text;
    let num=parseNumber([b1,b2]),extra='';
    if(!num){ // full-art cards: text sits on the artwork, retry with inverted / harder contrast
      st.innerHTML=`<span class="spin"></span> ${t('scan_retry')}`;
      for(const flt of['grayscale(1) invert(1) contrast(2.2)','grayscale(1) contrast(3) brightness(1.2)','grayscale(1) invert(1) contrast(3.5) brightness(0.9)']){
        for(const[x0,x1]of[[0,0.55],[0.45,1]]){const tx=(await w.recognize(cropCanvas(img,x0,x1,0.9,1,4,flt))).data.text;extra+=' '+tx;num=parseNumber([tx]);if(num)break}
        if(num)break;
      }
    }
    await w.setParameters({tessedit_char_whitelist:''});
    const name=matchName(top,data);
    const tries=[[name,num].filter(Boolean).join(' '),num,name].filter(Boolean);
    let q=null,found=[];
    for(const tq of tries){const r=findCards(data,tq,'');if(r.length){q=tq;found=r;break}}
    if(!q){
      st.innerHTML=`<b>${t('scan_fail')}</b>`;
      outEl.innerHTML=`<p class="muted">${t('scan_read')} <code>${esc((top+' '+b1+' '+b2+' '+extra).replace(/\s+/g,' ').trim().slice(0,160)||'—')}</code></p><p>${t('scan_tips')}</p>`;
      return;
    }
    closeModal();apply(q);
    if(found.length===1)openCard(lang,found[0].c.id);
    else toast(t('scan_found',{q,n:found.length}));
  }catch(e){st.innerHTML=`<b>${t('scan_fail')}</b>`;outEl.textContent=t('err_net')}
}
function runSearch(data,res,lang){
  const raw=search.q.trim();
  if(!raw&&!search.set){res.innerHTML=`<div class="empty">${t('type_to_search')}</div>`;return}
  const out=findCards(data,raw,search.set);
  renderResults(out,data,res,lang);
}
const isReprintSet=s=>s==='30th-c'||/^cel25c/.test(s||'');
function findCards(data,raw,setFilter){
  const tokens=norm(raw).split(' ').filter(Boolean);
  const words=tokens.filter(x=>!/^\d+\/\d+$/.test(x)&&!/^\d+$/.test(x));
  const nums=tokens.filter(x=>/^\d+$/.test(x));
  const fracs=tokens.filter(x=>/^\d+\/\d+$/.test(x)).map(x=>x.split('/').map(Number));
  const phrase=words.join(' ');
  const out=[];
  for(const c of data.cards){
    if(setFilter&&c.s!==setFilter)continue;
    const st=data.sets[c.s];
    if(!c.k)c.k=norm(c.n);
    if(!c.h)c.h=c.k+' '+norm(st?.n)+' '+norm(c.s)+' '+norm(c.l);
    if(words.length&&!words.every(w=>c.h.includes(w)))continue;
    const ln=parseInt(c.l,10);
    if(nums.length&&!nums.every(n=>ln===+n||c.h.split(' ').includes(n)))continue;
    if(fracs.length&&!fracs.every(([a,b])=>ln===a&&(st?.off===b||st?.tot===b)))continue;
    let score=0;
    if(phrase){if(c.k===phrase)score=3;else if(c.k.startsWith(phrase))score=2;else if(c.k.includes(phrase))score=1}
    out.push({c,st,score});
  }
  // Classic Collection reprints print the ORIGINAL card number (e.g. 58/102): add same-name reprints to number searches
  if(fracs.length&&!setFilter&&out.length){
    const best=new Map();for(const o of out)best.set(o.c.k,Math.max(best.get(o.c.k)||0,o.score));
    const have=new Set(out.map(o=>o.c.id));
    for(const c of data.cards){
      if(!isReprintSet(c.s)||have.has(c.id))continue;
      if(!c.k)c.k=norm(c.n);
      if(best.has(c.k))out.push({c,st:data.sets[c.s],score:best.get(c.k)});
    }
  }
  out.sort((a,b)=>b.score-a.score||(b.st?.o??-1)-(a.st?.o??-1)||(parseInt(a.c.l)||0)-(parseInt(b.c.l)||0));
  return out;
}
function renderResults(out,data,res,lang){
  const shown=out.slice(0,search.page*60);
  res.innerHTML=out.length?`<p class="muted small">${t('results',{n:out.length})}</p><div class="grid">${shown.map(({c,st})=>`
    <div class="tile" data-id="${esc(c.id)}">
      ${(()=>{const n=ownedCount(c.id,lang);return n?`<span class="badge" title="${esc(t('owned_n',{n}))}">${n}</span>`:''})()}
      <button class="wbtn ${inWishlist(c.id,lang)?'on':''}" data-wish="${esc(c.id)}" aria-label="${esc(t('quick_wish'))}" title="${esc(t('quick_wish'))}">${HEART}</button>
      <div class="img">${imgTag(c.i,c.s,c.l,c.n)}</div>
      <div class="nm" title="${esc(c.n)}">${esc(c.n)}</div>
      <div class="meta">${esc(st?.n||c.s)} · ${esc(numLabel(c.l,st?.off))}</div>
      ${isReprintSet(c.s)?`<div class="meta" style="color:var(--accent)" title="${t('reprint')}">♻ ${t('reprint_short')}</div>`:''}
    </div>`).join('')}</div>${out.length>shown.length?`<div style="text-align:center;margin:20px"><button class="btn" id="more">${t('show_more')}</button></div>`:''}`
    :`<div class="empty">${t('no_results')}</div>`;
  res.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openCard(lang,el.dataset.id));
  res.querySelectorAll('[data-wish]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();quickWish(lang,b.dataset.wish,b)});
  const more=res.querySelector('#more');if(more)more.onclick=()=>{search.page++;runSearch(data,res,lang)};
}

      ${e.hist?.length>1?`<div style="height:150px;position:relative"><canvas id="hchart"></canvas></div>`:`<p class="muted small">${t('no_history')}</p>`}
      <form class="form" id="edForm">
        <label>${t('variant')}<select name="variant">${VARIANTS.map(x=>`<option value="${x}" ${e.variant===x?'selected':''}>${t('v_'+x)}</option>`).join('')}</select></label>
        <label>${t('condition')}<select name="cond">${CONDITIONS.map(c=>`<option value="${c}" ${e.cond===c?'selected':''}>${c} · ${t('c_'+c)}</option>`).join('')}</select></label>
        <label>${t('qty')}<input type="number" name="qty" min="1" value="${e.qty}"></label>
        <label>${t('buy_price')}<input type="number" name="buy" min="0" step="0.01" value="${e.buy||''}"></label>
        <label>${t('buy_date')}<input type="date" name="date" value="${esc(e.date||'')}"></label>
        <label>${t('status')}<select name="status"><option value="owned" ${e.status!=='wish'?'selected':''}>${t('owned')}</option><option value="wish" ${e.status==='wish'?'selected':''}>${t('wish')}</option></select></label>
        <label class="full">${t('notes')}<input type="text" name="notes" value="${esc(e.notes||'')}"></label>
        ${extraFields(e)}
        <div class="full" style="display:flex;justify-content:space-between;gap:8px;margin-top:6px">
          <button type="button" class="btn danger" id="delBtn">🗑 ${t('delete')}</button>
          <span style="display:flex;gap:8px">${e.status==='wish'?`<button type="button" class="btn" id="gotBtn">✓ ${t('mark_owned')}</button>`:''}<button type="submit" class="btn primary">${t('save')}</button></span>
        </div>
      </form>
    </div></div>`);
  if(e.hist?.length>1&&window.Chart){
    charts.push(new Chart(m.querySelector('#hchart'),{type:'line',data:{labels:e.hist.map(h=>fmtDate(h.d)),datasets:[{data:e.hist.map(h=>h.v),borderColor:getCss('--accent'),backgroundColor:'transparent',tension:.3,pointRadius:2}]},options:chartOpts(false)}));
  }
  getDetail(e.lang,e.cardId).then(d=>{const el=m.querySelector('#livePrices');if(el)el.innerHTML=pricesBlock(d,e.variant)}).catch(()=>{const el=m.querySelector('#livePrices');if(el)el.innerHTML=''});
  const f=m.querySelector('#edForm');
  f.onsubmit=async ev=>{
    ev.preventDefault();
    const variantChanged=f.variant.value!==e.variant;
    Object.assign(e,{variant:f.variant.value,cond:f.cond.value,qty:Math.max(1,parseInt(f.qty.value)||1),buy:parseFloat(String(f.buy.value).replace(',','.'))||0,date:f.date.value,status:f.status.value,notes:f.notes.value.trim(),upd:Date.now(),...readExtra(f,e)});
    if(variantChanged){try{const d=await getDetail(e.lang,e.cardId);e.price=pickPrice(d.pricing,e.variant,d.variants?.normal);pushHistory(e)}catch(_){}}
    saveCollection();closeModal();
    const hits=checkAlerts(false);toast(hits.length?'🔔 '+t('alert_toast',{n:hits.length}):t('saved'));render();
  };
  m.querySelector('#delBtn').onclick=async()=>{
    if(await confirmBox(t('del_confirm',{n:e.name}))){deleted[e.uid]=Date.now();LS.set('pf_deleted',deleted);collection=collection.filter(x=>x.uid!==e.uid);saveCollection();toast(t('deleted'));render()}
    else openEntry(id);
  };
  const got=m.querySelector('#gotBtn');if(got)got.onclick=()=>{e.status='owned';e.date=today();e.upd=Date.now();saveCollection();closeModal();render();openEntry(id)};
}
const getCss=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function chartOpts(legend){
  const c=getCss('--muted'),g=getCss('--line');
  return{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:legend,labels:{color:c}},tooltip:{callbacks:{label:x=>(x.dataset.label?x.dataset.label+' : ':'')+fmtEur(x.parsed.y)}}},
    scales:{x:{ticks:{color:c,maxTicksLimit:8},grid:{color:g}},y:{ticks:{color:c,callback:v=>fmtEur(v)},grid:{color:g}}}};
}

/* ============ view: wishlist ============ */
function viewWish(m){
  const list=collection.filter(e=>e.status==='wish').sort((a,b)=>(entryValue(b)||0)-(entryValue(a)||0));
  const total=list.reduce((s,e)=>s+(entryValue(e)||0)*e.qty,0);
  m.innerHTML=`<h1>${t('wish_title')}</h1>
  ${alertsBanner(e=>e.status==='wish')}
  ${list.length?`<div class="stat wbudget"><div class="lbl">${t('wish_budget')}</div><div class="val">${fmtEur(total)}</div><div class="sub">${t('wish_count',{n:list.reduce((a,e)=>a+(e.qty||1),0)})}</div></div><div class="grid">${list.map(e=>entryTile(e,{remove:true})).join('')}</div>`:`<div class="empty">${t('wish_empty')}</div>`}`;
  m.querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>openEntry(el.dataset.uid));
  m.querySelectorAll('[data-x]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const e=collection.find(x=>x.uid===b.dataset.x);if(!e)return;
    deleted[e.uid]=Date.now();LS.set('pf_deleted',deleted);
    collection=collection.filter(x=>x!==e);saveCollection();render();
    toast(t('wish_removed',{n:e.name}),{label:t('undo'),fn:()=>{delete deleted[e.uid];LS.set('pf_deleted',deleted);e.upd=Date.now();collection.push(e);saveCollection();render()}});
  });
  m.querySelectorAll('.alerts [data-open]').forEach(el=>el.onclick=()=>openEntry(el.dataset.open));
  bindAlerts(m,e=>e.status==='wish');
}

/* ============ view: evolution ============ */
function viewEvo(m){
  m.innerHTML=`<h1>${t('evo_title')}</h1>${snapshots.length>1?`<div class="panel"><div class="chartbox"><canvas id="evo"></canvas></div></div>`:`<div class="empty">${t('evo_empty')}</div>`}`;
  if(snapshots.length>1&&window.Chart){
    charts.push(new Chart(m.querySelector('#evo'),{type:'line',data:{labels:snapshots.map(s=>fmtDate(s.d)),datasets:[
      {label:t('value'),data:snapshots.map(s=>s.value),borderColor:getCss('--accent'),backgroundColor:'transparent',tension:.25,pointRadius:2},
      {label:t('cost'),data:snapshots.map(s=>s.cost),borderColor:getCss('--muted'),borderDash:[5,4],backgroundColor:'transparent',tension:.25,pointRadius:0}]},options:chartOpts(true)}));
  }
}

/* ============ view: data ============ */
function download(name,content,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function viewData(m){
  const ic={
    account:'<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
    display:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>',
    backup:'<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
    alerts:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    advanced:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'
  };
  const sec=(k,title,body)=>`<section class="spanel"><h2 class="shead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic[k]}</svg>${title}</h2>${body}</section>`;
  const row=(title,desc,ctl)=>`<div class="srow"><div class="sinfo"><div class="stitle">${title}</div>${desc?`<div class="sdesc">${desc}</div>`:''}</div><div class="sctl">${ctl}</div></div>`;
  const seg=(name,cur,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button type="button" data-${name}="${v}" class="${cur===v?'on':''}">${l}</button>`).join('')}</div>`;
  const nCards=collection.filter(e=>e.status!=='wish').reduce((a,e)=>a+(e.qty||1),0);
  m.innerHTML=`<h1>${t('data_title')}</h1>
  ${sec('account',t('account'),row(
      user?`<span class="acc-av" style="display:inline-grid;margin-right:8px;vertical-align:middle">${esc((user.email||'?')[0].toUpperCase())}</span>${esc(user.email)}`:t('not_logged'),
      user?`<span id="syncInfo">${syncLabel()}</span>`:t('account_why'),
      `<button class="btn ${user?'':'primary'}" id="accOpen">${user?t('manage'):t('login')}</button>`))}
  ${sec('display',t('display'),
      row(t('lang_label'),'',seg('lang',settings.lang,[['fr',FLAGS.fr+' Français'],['en',FLAGS.en+' English']]))+
      row(t('theme_label'),'',seg('theme',settings.theme,[['dark',t('theme_dark')],['light',t('theme_light')]]))+
      row(t('pill_size'),'',pillControl(false)))}
  ${sec('backup',t('sec_backup'),`<p class="snote">${user?t('data_note_cloud'):t('data_note')}</p>`+
      row(t('exp_json_t'),t('exp_json_d',{n:nCards}),`<button class="btn primary" id="exJson">${t('btn_export')}</button>`)+
      row(t('imp_t'),t('imp_d'),`<label class="btn">${t('btn_import')}<input type="file" id="imp" accept=".json,application/json" hidden></label>`)+
      row(t('exp_csv_t'),t('exp_csv_d'),`<button class="btn" id="exCsv">${t('btn_export')}</button>`))}
  ${sec('alerts',t('sec_alerts'),row(t('notif_t'),t('notif_d')+' <span id="notifState"></span>',`<button class="btn" id="notif">${t('btn_enable')}</button>`))}
  ${sec('advanced',t('sec_advanced'),row(t('reload_t'),t('reload_d'),`<button class="btn" id="clr">${t('btn_reload')}</button>`))}
  <section class="spanel about">
    <div class="ab-head"><span class="ab-logo">${document.querySelector('.logo svg')?.outerHTML||''}</span><div><div class="ab-name">Gleamvault</div><div class="sdesc">${t('about_tag')} · v${APP_VERSION}</div></div></div>
    <dl class="ab-list">
      <div><dt>${t('ab_cards')}</dt><dd><a href="https://tcgdex.dev" target="_blank" rel="noopener">TCGdex</a></dd></div>
      <div><dt>${t('ab_prices')}</dt><dd>Cardmarket · TCGplayer<div class="muted" style="font-size:11.5px">${t('ab_daily')}</div></dd></div>
      <div><dt>${t('ab_images')}</dt><dd>TCGdex · Scrydex</dd></div>
      <div><dt>${t('ab_scan')}</dt><dd>Tesseract.js</dd></div>
    </dl>
    <p class="ab-legal">${t('ab_legal')}</p>
  </section>`;
  m.querySelectorAll('button[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  m.querySelectorAll('button[data-theme]').forEach(b=>b.onclick=()=>{settings.theme=b.dataset.theme;saveSettings();render()});
  m.querySelector('#exJson').onclick=()=>download(`gleamvault-${today()}.json`,JSON.stringify({app:'gleamvault',version:1,exported:new Date().toISOString(),collection,snapshots},null,1),'application/json');
  m.querySelector('#exCsv').onclick=()=>{
    const cols=['name','setName','localId','official','lang','variant','cond','grade','cert','qty','status','buy','date','value','manual','notes'];
    const rows=collection.map(e=>cols.map(c=>{const v=c==='value'?(entryValue(e)??''):c==='grade'?gradeStr(e):c==='cert'?(e.grade?.cert||''):e[c]??'';return '"'+String(v).replace(/"/g,'""')+'"'}).join(';'));
    download(`gleamvault-${today()}.csv`,'﻿'+cols.join(';')+'\n'+rows.join('\n'),'text/csv');
  };
  m.querySelector('#imp').onchange=async ev=>{
    const file=ev.target.files[0];if(!file)return;
    try{
      const data=JSON.parse(await file.text());
      const list=Array.isArray(data)?data:data.collection;
      if(!Array.isArray(list)||list.some(e=>!e.cardId||!e.name))throw 0;
      if(collection.length&&!(await confirmBox(t('import_confirm',{a:collection.length,b:list.length}))))return;
      const now=Date.now();collection.forEach(x=>{deleted[x.uid]=now});LS.set('pf_deleted',deleted);
      collection=list.map(e=>Object.assign({uid:uid(),qty:1,status:'owned',variant:'normal',cond:'NM',lang:'fr',added:Date.now(),hist:[]},e,{upd:now+1}));
      if(Array.isArray(data.snapshots))snapshots=data.snapshots;
      LS.set('pf_snapshots',snapshots);saveCollection();toast(t('import_ok',{n:collection.length}));render();
    }catch(e){toast(t('import_bad'))}
  };
  m.querySelector('#accOpen').onclick=()=>openAccount();
  bindPill(m);
  const ns=m.querySelector('#notifState');
  const showN=()=>{ns.textContent='Notification' in window?(Notification.permission==='granted'?'· ✓ '+t('notif_on'):Notification.permission==='denied'?'· '+t('notif_off'):''):'· '+t('notif_off')};showN();
  m.querySelector('#notif').onclick=async()=>{try{await Notification.requestPermission()}catch(_){}showN()};
  m.querySelector('#clr').onclick=async()=>{idx.fr=idx.en=null;loading.fr=loading.en=null;await loadIndex(settings.cardLang,true).catch(()=>{});toast(t('cache_cleared'))};
}

/* ============ boot ============ */
initSupabase();
route();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
loadIndex(settings.cardLang).catch(()=>{});
if(collection.length&&Date.now()-settings.lastRefresh>AUTO_REFRESH)refreshPrices(true);
</script>
</body>
