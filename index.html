<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gleamvault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<meta name="theme-color" content="#0f1117">
<meta name="description" content="Suivi de collection Pokémon TCG : cartes FR/EN, prix Cardmarket, scan, alertes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gleamvault">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f1117;--bg2:#161a23;--card:#1c212c;--card2:#232937;--line:#2c3342;
  --text:#e9ecf2;--muted:#8b93a7;--accent:#ffcb05;--accent2:#e3350d;--ok:#3ecf8e;--ko:#ff5d5d;
  --shadow:0 6px 24px rgba(0,0,0,.35);--r:14px;
}
[data-theme=light]{
  --bg:#f4f5f8;--bg2:#ffffff;--card:#ffffff;--card2:#f0f2f6;--line:#e1e4ea;
  --text:#1a1d24;--muted:#69718a;--accent:#d9a400;--accent2:#d12f0b;--ok:#13a36a;--ko:#d93636;
  --shadow:0 6px 24px rgba(20,30,60,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,svg,canvas,video{max-width:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:23px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.logo svg{width:38px;height:38px;flex:none}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
nav a:hover{color:var(--text);background:var(--card2)}
nav a.active{color:#1a1d24;background:var(--accent)}
.hactions{display:flex;gap:6px;align-items:center}
#accBtn{position:relative}
html[data-priv] .money,html[data-priv] .tile .row,html[data-priv] .alerts{display:none!important}
.sumbar.safe{justify-content:space-between;align-items:center;gap:10px;flex-wrap:nowrap;color:var(--muted)}
.sumbar.safe .safe-tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumbar.safe .btn{flex:none;min-height:34px}
#privBtn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}#accBtn .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
#accBtn .dot.ok{background:var(--ok)}#accBtn .dot.syncing{background:var(--accent)}#accBtn .dot.error{background:var(--ko)}
.stat.wbudget{display:flex;flex-direction:column;margin:0 0 18px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.stat.wbudget .val{color:var(--accent);font-size:30px}
.stat.wbudget .lbl{color:var(--text);font-weight:500}
.spanel{max-width:820px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:0 0 14px;overflow:hidden}
.shead{display:flex;align-items:center;gap:10px;font-size:15px;margin:0;padding:13px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--card2) 55%,var(--card))}
.shead svg{width:18px;height:18px;color:var(--accent);flex:none}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 18px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.sinfo{min-width:0}
.stitle{font-weight:500;overflow-wrap:anywhere}
.sdesc{color:var(--muted);font-size:13px;margin-top:2px}
.sctl{flex:none}
.snote{margin:0;padding:12px 18px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.credit{color:var(--muted);font-size:12px;margin:28px 0 4px;text-align:center}
.credit a{color:var(--muted)}
.about .ab-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.about .ab-logo svg{width:44px;height:44px;display:block}
.about .ab-name{font-weight:700;font-size:17px}
.ab-list{margin:0;padding:6px 18px}
.ab-list>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ab-list>div:last-child{border-bottom:0}
.ab-list dt{color:var(--muted)}
.ab-list dd{margin:0;text-align:right}
.ab-list a{color:var(--text)}
.ab-legal{margin:0;padding:12px 18px 16px;font-size:11.5px;line-height:1.55;color:var(--muted);border-top:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.sortbar{margin-top:-4px}
.sortbar select{width:auto}
.sumbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.sumbar:hover{border-color:var(--muted)}
.sumbar .sb-v b{font-size:18px}
.sumbar .sb-go{margin-left:auto;display:inline-flex;align-items:center;gap:2px;color:var(--muted);font-size:13px;white-space:nowrap}
.vbar{margin-top:10px}.vb-row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.lflag{display:inline-block;width:16px;height:11px;margin-right:6px;vertical-align:-1px;border-radius:2px;overflow:hidden}.lflag svg{width:100%;height:100%;display:block}
#ptr{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));z-index:25;transform:translate(-50%,-60px);opacity:0;display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;box-shadow:var(--shadow);pointer-events:none;transition:opacity .15s;white-space:nowrap}
#ptr .ptr-ic{display:inline-block;transition:transform .15s;color:var(--accent);font-weight:700}
#ptr.busy{opacity:1;transition:transform .2s}
#ptr.busy .ptr-ic{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;font-size:0}
.touch-only{display:none}
@media (hover:none) and (pointer:coarse){.ptr-hide{display:none!important}.touch-only{display:inline}}
.sumbar .sb-up{flex-basis:100%;order:3;font-size:12px;color:var(--muted)}
.coll-head{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.coll-head .tbtitle{flex:1 1 auto}
.btn-sm{padding:7px 12px;font-size:14px;gap:6px}
.cfilters{display:flex;gap:10px;align-items:center;margin:0 0 14px}
.cf-row{display:flex;gap:8px;flex:1 1 auto;min-width:0}
.searchbox{position:relative;flex:1;min-width:0;display:block}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchbox input[type=text]{padding-left:38px}
.btn.cf-toggle{display:none;position:relative}
.langseg{display:inline-flex;margin:0 0 12px}
.scanbox input[type=text]{padding-right:52px}
.scanbox .scanic{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:42px;height:38px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.scanbox .scanic:hover{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.scanbox .scanic svg{position:static;transform:none;color:inherit}
.afilters .cf-panel{align-items:center}
.af-reset{white-space:nowrap;font-size:13.5px}
.more-sentinel{display:flex;justify-content:center;min-height:40px;padding:14px}
.tile .img{position:relative}
.qadd{position:absolute;z-index:2;right:4px;bottom:4px;width:var(--pill);height:var(--pill);border-radius:50%;border:0;padding:0;display:grid;place-items:center;cursor:pointer;background:rgba(14,16,22,.9);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 2px 6px rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);-webkit-tap-highlight-color:transparent;transition:transform .12s,background .15s,color .15s}
.qadd::before{content:'';position:absolute;inset:-8px;border-radius:50%}
.qadd svg{width:var(--pillic);height:var(--pillic);display:block}
.qadd .qa-ok{display:none}
@media (hover:hover){.qadd:hover{background:#ffcb05;color:#1a1d24}}
.qadd:active{transform:scale(.88)}.qadd.busy{opacity:.55}
.qadd.done{background:#3ecf8e;color:#0f1117;box-shadow:0 2px 6px rgba(0,0,0,.35)}.qadd.done .qa-plus{display:none}.qadd.done .qa-ok{display:block}
.ah-t{font-size:15px;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:0;text-decoration:underline}
.ah-sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.ah-set{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font:inherit;font-size:14px}
.ah-set img{height:18px;width:auto}
.ah-set:hover{border-color:var(--accent)}
.sheet-cta{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px 24px;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);border-radius:0 0 18px 18px}
.cta-own{margin-right:auto;font-size:13px;color:var(--muted)}
.cta-wish{gap:7px}.cta-wish svg{width:20px;height:20px;flex:none}
.cta-wish.on{color:var(--accent2);opacity:1}.cta-wish.on svg path{fill:currentColor}
.sh-wish>span{display:inline-flex;align-items:center;gap:7px}.sh-wish>span svg{width:17px;height:17px}.sh-wish>span svg path{fill:currentColor}
body:has(#ov .sheet-cta) .toast{bottom:90px}
.sh{display:grid;grid-template-columns:320px 1fr;gap:28px;padding:26px 26px 8px}
.sh-hero{position:relative;align-self:start;position:sticky;top:0;padding-top:4px}
.sh-imgw{position:relative;border-radius:14px;background:radial-gradient(70% 60% at 50% 45%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 72%)}
.sh-img{width:100%;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.5);cursor:zoom-in;display:block}
.sh-zoom{position:absolute;right:-8px;bottom:-8px;width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:rgba(14,16,22,.9);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 2px 6px rgba(0,0,0,.4)}
.sh-name{margin:2px 40px 8px 0;font-size:24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sh-flag svg{width:22px;height:15px;border-radius:2px;display:block}
.sh-chips{display:flex;flex-wrap:wrap;gap:6px}
.sh-chip{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.sh-chip.r{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.sh-illu{font-size:12.5px;color:var(--muted);margin-top:8px}
.sh-price{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 4px;margin-top:14px}
.sh-price.safe{padding:14px;color:var(--muted);font-size:14px}
.sh-plab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sh-prow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.sh-pval{font-size:30px;font-weight:700;line-height:1.15;margin-top:2px}
.sh-pchg{font-size:13px;font-weight:600}
.sh-prange{font-size:12.5px;color:var(--muted);margin-top:4px}
.spark{flex:none;margin-bottom:4px}
.sh-pdet{margin-top:10px;border-top:1px solid var(--line)}
.sh-pdet summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;cursor:pointer;font-size:14px}
.sh-pdet summary::-webkit-details-marker{display:none}
.sh-pdet summary>span::after{content:' ▾';color:var(--muted)}
.sh-pdet[open] summary>span::after{content:' ▴'}
.sh-pdet-in{padding-bottom:10px}
.sh-links{display:flex;gap:14px}
.sh-links a{color:var(--muted);text-decoration:none;font-size:13.5px}
.sh-links a:hover{color:var(--text)}
.sh-wish{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent2) 10%,var(--card));border:1px solid color-mix(in srgb,var(--accent2) 30%,var(--line));font-size:14px}
.sh-wish>span{color:var(--accent2);font-weight:600}
.sh-wish .linkbtn{text-decoration:none;color:var(--text);font-size:13.5px}
.sh-sec{margin:22px 0 10px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.sh-lbl{font-size:13px;color:var(--muted);margin:14px 0 7px}
.sh-seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.sh-seg button{flex:1;padding:9px 6px;border-radius:9px;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.sh-seg button.on{background:var(--card2);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.sh-pills{display:flex;gap:6px}
.sh-pills button{flex:1;min-width:0;padding:9px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.sh-pills button.on{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:var(--accent);color:var(--accent)}
.sh-cdesc{font-size:12.5px;color:var(--muted);margin-top:7px}
.sh-step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.sh-step button{width:46px;height:42px;border:0;background:none;color:var(--text);font-size:20px;cursor:pointer}
.sh-step input[type=number]{width:52px;text-align:center;border:0;background:none;font-weight:700;font-size:16px;padding:0;-moz-appearance:textfield;box-shadow:none}
.sh-step input::-webkit-inner-spin-button,.sh-step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sh-form details.extra{margin-top:10px;padding:11px 14px;border-radius:12px;background:var(--card)}
.sh-form details.extra summary{font-size:14px}
.sh-copy{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.sh-copy.focus,.sh-copy.open{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.sh-copy .q{min-width:36px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:14px}
.sh-copy .t{flex:1;min-width:0}
.sh-copy .t>div:first-child{font-weight:600;font-size:14.5px}
.sh-copy .t>div+div{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.sh-copy .v{text-align:right;font-weight:700;font-size:14.5px;white-space:nowrap}
.sh-copy .v small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.sh-copy .v small.pos{color:var(--ok)}.sh-copy .v small.neg{color:var(--ko)}
.gbadge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);margin-left:4px;vertical-align:1px}
.sh-edit{flex:none;width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:rgba(14,16,22,.9);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.sh-copy .sh-edit+.sh-edit{margin-left:-6px}
.sh-edit.sh-del{color:#ff5d5d}.sh-del:hover{color:#ff8080}
.sh-editor{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:14px;padding:4px 14px 14px;margin:-2px 0 10px;background:color-mix(in srgb,var(--card) 60%,transparent)}
.sh-edbtns{display:flex;gap:8px;margin-top:14px;align-items:center}.sh-edbtns span{flex:1}
.sh-tot{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin:4px 2px 0}.sh-tot b{color:var(--text)}
.imgfs{position:fixed;inset:0;z-index:90;background:rgba(5,7,11,.97);display:flex;flex-direction:column}
.imgfs-x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:2}
.imgfs-sc{flex:1;overflow:hidden;display:grid;place-items:center;padding:60px 16px 70px;transition:transform .15s}
.imgfs-sc img{max-width:min(100%,520px);max-height:100%;border-radius:16px;cursor:zoom-in;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.imgfs.zoomed .imgfs-sc{overflow:auto;place-items:start;padding:0}
.imgfs.zoomed .imgfs-sc img{max-width:none;max-height:none;width:240%;border-radius:0;cursor:zoom-out}
.imgfs-hint{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#8b93a7;font-size:13px;margin:0;pointer-events:none}
.imgfs.zoomed .imgfs-hint{display:none}
.nr-acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nr-acts .btn{white-space:nowrap;gap:6px}.nr-acts svg{width:17px;height:12px;border-radius:2px;flex:none}
.cf-toggle.on{border-color:var(--accent);color:var(--accent)}
.cf-count{min-width:18px;height:18px;border-radius:999px;background:var(--accent);color:#1a1d24;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.cf-panel{display:flex;gap:10px;flex:none}
.cf-panel select{width:auto;max-width:220px}
.pdemo{display:inline-grid;place-items:center;border-radius:999px;background:var(--accent);color:#1a1d24;font-weight:700;line-height:1;margin-right:6px}
.pd-s{width:15px;height:15px;font-size:9px}.pd-m{width:19px;height:19px;font-size:11px}.pd-l{width:25px;height:25px;font-size:13.5px}
.pwdwrap{position:relative;display:block}.pwdwrap input{padding-right:44px}
.pwdeye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;display:grid;place-items:center}.pwdeye:hover{color:var(--text)}
.acc-av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#1a1d24;font-weight:700;font-size:12px;display:grid;place-items:center}
.flag{border:2px solid transparent;border-radius:5px;padding:0;width:28px;height:20px;cursor:pointer;background:none;overflow:hidden;opacity:.55;display:flex}
.flag svg{width:100%;height:100%}
.flag.on{opacity:1;border-color:var(--accent)}
.iconbtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
main{max-width:1280px;margin:0 auto;padding:22px 20px 80px}
h1{font-size:24px;margin:6px 0 16px}
h2{font-size:18px;margin:26px 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat .lbl{color:var(--muted);font-size:13px}
.stat .val{font-size:26px;font-weight:700;margin-top:4px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--ko)}

/* ============ state & storage ============ */
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Storage error')}}
};
const settings = Object.assign({lang:'fr',cardLang:'fr',theme:'dark',lastRefresh:0,sort:'value'}, LS.get('pf_settings',{}));
let collection = LS.get('pf_collection',[]);
let snapshots = LS.get('pf_snapshots',[]);
const saveSettings=()=>LS.set('pf_settings',settings);
let deleted = LS.get('pf_deleted',{});
const saveCollection=()=>{LS.set('pf_collection',collection);takeSnapshot();scheduleSync()};
const idx = {fr:null,en:null};       // card index per language
const loading = {fr:null,en:null};
const detailCache = {};

function t(k,vars){let s=(I18N[settings.lang]||I18N.fr)[k]??I18N.fr[k]??k;if(vars)for(const[a,b]of Object.entries(vars))s=s.replaceAll('{'+a+'}',b);return s}

async function loadIndex(lang,force){
  if(idx[lang]&&!force)return idx[lang];
  if(loading[lang]&&!force)return loading[lang];
  loading[lang]=(async()=>{
    const cached=!force&&await idb.get('index_'+lang);
    if(cached&&cached.v===INDEX_VER&&Date.now()-cached.ts<INDEX_TTL){applySetNames(lang,cached);idx[lang]=cached;return cached}
    try{
      const [cards,sets,pocket,frSets]=await Promise.all([getJSON(`${API}/${lang}/cards`),getJSON(`${API}/${lang}/sets`),getJSON(`${API}/${lang}/series/tcgp`).catch(()=>({sets:[]})),lang==='en'?getJSON(`${API}/fr/sets`).catch(()=>[]):Promise.resolve([])]);
      const frName={};(frSets||[]).forEach(x=>{frName[x.id]=x.name});
      const excl=new Set((pocket.sets||[]).map(s=>s.id));
      const setMap={};sets.forEach((s,i)=>{if(!excl.has(s.id))setMap[s.id]={id:s.id,src:s.name,fr:frName[s.id],o:i,off:s.cardCount?.official,tot:s.cardCount?.total,sym:s.symbol||''}});
      const list=[];
      for(const c of cards){
        const sid=c.id.slice(0,c.id.length-String(c.localId).length-1);
        if(excl.has(sid)||!setMap[sid])continue;
        list.push({id:c.id,n:c.name,l:String(c.localId),s:sid,i:c.image||''});
      }
      const data={v:INDEX_VER,ts:Date.now(),cards:list,sets:setMap};
      await idb.set('index_'+lang,data);applySetNames(lang,data);idx[lang]=data;return data;
    }catch(e){if(cached&&cached.v===INDEX_VER){applySetNames(lang,cached);idx[lang]=cached;return cached}loading[lang]=null;throw e}
  })();
  return loading[lang];
}

/* ============ pricing ============ */
function pickPrice(pricing,variant,hasNormal){
  const cm=pricing?.cardmarket;
  if(!cm)return null;
  const useHolo=(variant==='reverse'||(variant==='holo'&&hasNormal))&&(cm['trend-holo']>0||cm['avg7-holo']>0);
  const f=k=>{const v=cm[useHolo?k+'-holo':k];return v==null||v===0?null:v};
  const p={trend:f('trend'),low:f('low'),avg1:f('avg1'),avg7:f('avg7'),avg30:f('avg30'),updated:cm.updated};
  // robust estimate: median of trend + sales averages (Cardmarket's trend alone can be erratic on cheap/reverse cards)
  const vals=[p.trend,p.avg1,p.avg7,p.avg30].filter(v=>v>0).sort((a,b)=>a-b);
  p.value=vals.length?(vals.length%2?vals[(vals.length-1)/2]:(vals[vals.length/2-1]+vals[vals.length/2])/2):p.low;
  if(p.value!=null)p.value=Math.round(p.value*100)/100;
  return p.value==null?null:p;
}
function priceRange(p){
  if(!p)return null;
  const vals=[p.avg1,p.avg7,p.avg30,p.trend].filter(v=>v>0);
  if(!vals.length)return null;
  return {min:Math.min(...vals),max:Math.max(...vals)};
}

/* ============ snapshots ============ */
function totals(list=collection.filter(e=>e.status!=='wish')){
  let value=0,count=0,cost=0,costBase=0,valueWithCost=0,withCost=0;
  for(const e of list){
    const v=entryValue(e)||0;value+=v*e.qty;count+=e.qty;
    if(e.buy>0){cost+=e.buy*e.qty;valueWithCost+=v*e.qty;withCost++}
  }
  return{value,count,cost,gain:valueWithCost-cost,gainPct:cost?((valueWithCost-cost)/cost*100):null,withCost,unique:list.length};
}
function takeSnapshot(){
  const tt=totals();const d=today();
  const s={d,value:+tt.value.toFixed(2),cost:+tt.cost.toFixed(2),count:tt.count};
  const i=snapshots.findIndex(x=>x.d===d);
  if(i>=0)snapshots[i]=s;else snapshots.push(s);
  snapshots.sort((a,b)=>a.d.localeCompare(b.d));
  LS.set('pf_snapshots',snapshots);
}
function pushHistory(e){
  if(e.price?.value==null)return;
  e.hist=e.hist||[];const d=today();
  const i=e.hist.findIndex(h=>h.d===d);
  if(i>=0)e.hist[i].v=e.price.value;else e.hist.push({d,v:e.price.value});
  if(e.hist.length>400)e.hist=e.hist.slice(-400);
}
function change7(e){
  if(!e.hist||e.hist.length<2||e.price?.value==null)return null;
  const target=Date.now()-7*864e5;let ref=null;
  for(const h of e.hist){if(new Date(h.d).getTime()<=target)ref=h}
  if(!ref)ref=e.hist[0];
  if(ref.d===today()||!ref.v)return null;
  return (e.price.value-ref.v)/ref.v*100;
}

let refreshing=false;
async function refreshPrices(silent){
  if(refreshing||!collection.length)return;
  refreshing=true;
  await Promise.all([...new Set(collection.map(e=>e.lang))].map(l=>loadIndex(l).catch(()=>{})));syncEntrySetNames();
  const keys=[...new Set(collection.map(e=>e.lang+':'+e.cardId))];
  let done=0;const btn=document.getElementById('refreshBtn');
  const upd=()=>{if(btn){btn.disabled=true;btn.innerHTML=`<span class="spin"></span> ${t('refreshing',{p:done,t:keys.length})}`}};
  upd();
  const queue=[...keys];let failed=0;
  async function worker(){
    while(queue.length){
      const k=queue.shift();const[lang,...rest]=k.split(':');const id=rest.join(':');
      try{
        delete detailCache[k];
        const d=await getDetail(lang,id);
        for(const e of collection.filter(x=>x.lang===lang&&x.cardId===id)){
          const p=pickPrice(d.pricing,e.variant,d.variants?.normal);
          e.price=p;e.tcp=d.pricing?.tcgplayer||null;pushHistory(e);
        }
      }catch(err){failed++}
      done++;upd();
    }
  }
  await Promise.all(Array.from({length:6},worker));
  settings.lastRefresh=Date.now();saveSettings();saveCollection();
  refreshing=false;
  const hits=checkAlerts(false);
  if(hits.length){toast('🔔 '+t('alert_toast',{n:hits.length}));try{if('Notification' in window&&Notification.permission==='granted')hits.forEach(e=>new Notification('Gleamvault',{body:t('alert_msg',{n:e.name,v:fmtEur(entryValue(e))})}))}catch(_){}}
  else if(!silent||failed)toast(failed?t('err_net'):t('saved'));
  render();
}

const SCRYDEX_SET={'30th':'me55','30th-c':'me55c'};

const SCRYDEX_NUM={'30th-c':{'001':'4','002':'5','003':'11','004':'11g','005':'18','006':'19','007':'25','008':'33','009':'41','010':'43','011':'47','012':'50','013':'57','014':'58','015':'69','016':'85','017':'89','018':'94','019':'99','020':'100','021':'101','022':'106p','023':'106m','024':'106','025':'108','026':'114','027':'123','028':'138','029':'149','030':'203'}};
function scrydexId(setId,localId){
  if(!setId||!localId)return null;
  if(SCRYDEX_NUM[setId]){const n=SCRYDEX_NUM[setId][localId];return n?SCRYDEX_SET[setId]+'-'+n:null}
  let s=SCRYDEX_SET[setId];
  if(!s){const m=/^([a-z]+)0*(\d+)(\.5)?([a-z]*)$/i.exec(setId);s=m?m[1]+m[2]+(m[3]?(m[1]==='sm'?'5':'pt5'):'')+m[4]:setId}

  }
  const snaps=new Map();for(const s of[...(remote.snapshots||[]),...(local.snapshots||[])])snaps.set(s.d,s);
  const limit=Date.now()-120*864e5;for(const k of Object.keys(del))if(del[k]<limit)delete del[k];
  return{collection:[...map.values()],snapshots:[...snaps.values()].sort((a,b)=>a.d.localeCompare(b.d)),del};
}
async function syncNow(first){
  if(!sb||!user)return;
  if(syncing){syncAgain=true;return}
  syncing=true;setSync('syncing');
  try{
    const before=JSON.stringify(collection);
    const{data,error}=await sb.from('user_data').select('data').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    const merged=mergeData({collection,snapshots,del:deleted},data?.data||{});
    collection=merged.collection;snapshots=merged.snapshots;deleted=merged.del;
    LS.set('pf_collection',collection);LS.set('pf_snapshots',snapshots);LS.set('pf_deleted',deleted);
    const{error:e2}=await sb.from('user_data').upsert({user_id:user.id,data:{v:1,collection,snapshots,del:deleted},updated_at:new Date().toISOString()});
    if(e2)throw e2;
    settings.lastSync=Date.now();saveSettings();setSync('ok');
    if(JSON.stringify(collection)!==before&&!document.querySelector('.ov'))render();
    if(first)toast(t('sync_first',{n:collection.length}));
  }catch(err){console.warn('sync',err);setSync('error')}
  syncing=false;
  if(syncAgain){syncAgain=false;syncNow()}
}

function authErr(e){
  const m=String(e?.message||e||'');
  if(/invalid login/i.test(m))return t('err_login');
  if(/not confirmed/i.test(m))return t('err_confirm');
  if(/already registered|already exists/i.test(m))return t('err_exists');
  if(/security purposes|after \d+ seconds/i.test(m))return t('err_wait');
  if(/rate limit|too many/i.test(m))return t('err_rate');
  if(/password/i.test(m))return t('err_pwd')+' ('+m+')';
  return m||t('err_net');
}

function entryTile(e,opts={}){
  const v=entryValue(e);const ch=e.buy>0&&v!=null?(v-e.buy)/e.buy*100:null;

/* ============ scan (free OCR in the browser, Tesseract.js) ============ */
let ocrWorker=null,ocrLang=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
async function getOcr(lang){
  if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  const l=lang==='fr'?'fra':lang==='ja'?'jpn':'eng';
  if(ocrWorker&&ocrLang===l)return ocrWorker;
  if(ocrWorker){try{await ocrWorker.terminate()}catch(_){}}
  ocrWorker=await Tesseract.createWorker(l);ocrLang=l;return ocrWorker;
}
function fileToImage(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
function cropCanvas(img,x0,x1,y0,y1,scale,filter='grayscale(1) contrast(1.7)'){
  const W=img.naturalWidth,H=img.naturalHeight,sw=(x1-x0)*W,sh=(y1-y0)*H,k=Math.min(scale,2400/sw);
  const c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  const x=c.getContext('2d');x.filter=filter;x.drawImage(img,x0*W,y0*H,sw,sh,0,0,c.width,c.height);return c;
}
function parseNumber(texts){
  for(const tx of texts){const m=/(\d[\d ]{0,4}?)\s*\/\s*(\d{2,3})(?!\d)/.exec(tx);if(m){const a=m[1].replace(/\s/g,'');if(+a>0&&+m[2]>=10)return a+'/'+m[2]}}
  for(const tx of texts){const m=/\b(TG|GG|SV|RC)\s?(\d{1,3})\b/i.exec(tx);if(m)return(m[1]+m[2].padStart(2,'0')).toUpperCase()}
  return null;
}
function matchName(text,data){
  const tx=' '+norm(text)+' ';
  if(!data.names){const s=new Set();for(const c of data.cards){if(!c.k)c.k=norm(c.n);s.add(c.k)}data.names=[...s].filter(n=>n.length>=3).sort((a,b)=>b.length-a.length)}
  let best=null;
  for(const n of data.names){
    let i=tx.indexOf(' '+n+' ');if(i<0&&n.length>=6&&!n.includes(' '))i=tx.indexOf(n);
    if(i<0)continue;
    if(/(olution|olue|olves|from)\w*\s*(de|d)?\s*$/.test(tx.slice(Math.max(0,i-18),i)))continue; // skip "Évolution de : X"
    if(!best||n.length>best.n.length||(n.length===best.n.length&&i<best.i))best={n,i};
  }
  return best?.n||null;
}
async function scanCard(file,data,lang,apply){
  const m=openModal(`<div class="mpad"><h2 style="margin:0 40px 12px 0">📷 ${t('scan_title')}</h2>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start"><img id="scanPrev" alt="" style="width:150px;border-radius:10px;background:var(--card2)">
    <div style="flex:1;min-width:180px"><p id="scanStatus"><span class="spin"></span> ${t('scan_loading')}</p><div id="scanOut" class="small"></div></div></div></div>`,'sm');
  const st=m.querySelector('#scanStatus'),outEl=m.querySelector('#scanOut');
  let img;try{img=await fileToImage(file);m.querySelector('#scanPrev').src=img.src}catch(e){st.textContent=t('import_bad');return}
  try{
    const w=await getOcr(lang);
    st.innerHTML=`<span class="spin"></span> ${t('scan_reading')}`;
    await w.setParameters({tessedit_char_whitelist:''});
    const top=(await w.recognize(cropCanvas(img,0,1,0,0.14,1.5))).data.text;
    await w.setParameters({tessedit_char_whitelist:'0123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZ '});
    const b1=(await w.recognize(cropCanvas(img,0,0.55,0.91,1,4))).data.text;
    const b2=(await w.recognize(cropCanvas(img,0.45,1,0.91,1,4))).data.text;
    let num=parseNumber([b1,b2]),extra='';
    if(!num){ // full-art cards: text sits on the artwork, retry with inverted / harder contrast
      st.innerHTML=`<span class="spin"></span> ${t('scan_retry')}`;
      for(const flt of['grayscale(1) invert(1) contrast(2.2)','grayscale(1) contrast(3) brightness(1.2)','grayscale(1) invert(1) contrast(3.5) brightness(0.9)']){
        for(const[x0,x1]of[[0,0.55],[0.45,1]]){const tx=(await w.recognize(cropCanvas(img,x0,x1,0.9,1,4,flt))).data.text;extra+=' '+tx;num=parseNumber([tx]);if(num)break}
        if(num)break;
      }
    }
    await w.setParameters({tessedit_char_whitelist:''});
    const name=matchName(top,data);
    const tries=[[name,num].filter(Boolean).join(' '),num,name].filter(Boolean);
    let q=null,found=[];
    for(const tq of tries){const r=findCards(data,tq,'');if(r.length){q=tq;found=r;break}}
    if(!q){
      st.innerHTML=`<b>${t('scan_fail')}</b>`;
      outEl.innerHTML=`<p class="muted">${t('scan_read')} <code>${esc((top+' '+b1+' '+b2+' '+extra).replace(/\s+/g,' ').trim().slice(0,160)||'—')}</code></p><p>${t('scan_tips')}</p>`;
      return;
    }
    closeModal();apply(q);
    if(found.length===1)openCard(lang,found[0].c.id);
    else toast(t('scan_found',{q,n:found.length}));
  }catch(e){st.innerHTML=`<b>${t('scan_fail')}</b>`;outEl.textContent=t('err_net')}
}
function runSearch(data,res,lang){
  const raw=search.q.trim();
  if(!raw&&!search.set){renderAddHome(data,res,lang);return}
  let out=findCards(data,raw,search.set);
  // names typed in another language (e.g. « Dracaufeu » while browsing English or Japanese cards) are matched through the Pokédex number
  if(/[a-z]/i.test(raw)&&(lang==='ja'||!out.length)){
    const req=++jaReq;
    if(!out.length)res.innerHTML=`<div class="empty"><span class="spin"></span> ${t('ja_searching')}</div>`;
    crossLangIds(lang,raw).then(ids=>{
      if(req!==jaReq||view!=='add'||settings.cardLang!==lang)return;
      if(ids&&ids.size){
        const rest=norm(raw).split(' ').filter(w=>/\d/.test(w)).join(' ');
        const extra=findCards(data,rest,search.set).filter(o=>ids.has(o.c.id));
        const seen=new Set(out.map(o=>o.c.id));extra.forEach(o=>{if(!seen.has(o.c.id))out.push(o)});
      }
      renderResults(finishResults(out),data,res,lang);
    });
    if(!out.length)return;
  }
  renderResults(finishResults(out),data,res,lang);
}
let jaReq=0;const dexCache={};
async function crossLangIds(target,q){
  const key=target+'|'+norm(q);if(key in dexCache)return dexCache[key];
  const sources=target==='ja'?(settings.lang==='en'?['en','fr']:['fr','en']):[target==='fr'?'en':'fr'];
  const phrase=norm(q).split(' ').filter(w=>!/\d/.test(w)).join(' ');let ids=null;
  for(const srcLang of sources){
    try{
      const src=await loadIndex(srcLang);
      let cand=src.cards.filter(c=>(c.k||(c.k=norm(c.n)))===phrase);
      if(!cand.length)cand=src.cards.filter(c=>c.k.startsWith(phrase));
      for(const c of cand.slice(0,3)){
        const d=await getDetail(srcLang,c.id).catch(()=>null);
        const dex=d?.dexId?.[0];if(!dex)continue;
        let r=await getJSON(`${API}/${target}/cards?dexId=${dex}`).catch(()=>[]);
        if(!Array.isArray(r)||!r.length)r=await getJSON(`${API}/${target}/cards?dexId=eq:${dex}`).catch(()=>[]);
        if(Array.isArray(r)&&r.length){ids=new Set(r.map(x=>x.id));break}
      }
    }catch(_){}
    if(ids)break;
  }
  dexCache[key]=ids;return ids;
}
function finishResults(out){
  if(settings.secretOnly)out=out.filter(o=>isSecret(o.c,o.st));
  const mode=settings.searchSort||'relevance';
  if(mode!=='relevance'){
    const so=o=>o.st?.o??-1;
    out.sort(mode==='num_desc'?(a,b)=>so(b)-so(a)||numKey(b.c.l)-numKey(a.c.l)
      :mode==='num_asc'?(a,b)=>so(b)-so(a)||numKey(a.c.l)-numKey(b.c.l)
      :mode==='newest'?(a,b)=>so(b)-so(a)||numKey(a.c.l)-numKey(b.c.l)
      :(a,b)=>so(a)-so(b)||numKey(a.c.l)-numKey(b.c.l));
  }
  return out;
}
// card number as a sortable value: plain numbers first, then lettered specials (TG05, GG10, SV049…) after the main numbering
const numKey=l=>{const s=String(l||'');if(/^\d+$/.test(s))return parseInt(s,10);const n=parseInt(s.replace(/\D/g,''),10)||0;return 10000+n};
// "secret" = beyond the set's official count (illustration rares, special illustration rares, gold…) or a lettered gallery/special number
// promo sets (svp, swshp, smp, mep…) use lettered numbers for ordinary promos: never "secret"
const isPromoSet=id=>/^[a-z0-9.]*p$/i.test(id||'');
const isSecret=(c,st)=>{const s=String(c.l||'');if(/^\d+$/.test(s))return !!st?.off&&parseInt(s,10)>st.off;return !isPromoSet(c.s)};
const isReprintSet=s=>s==='30th-c'||/^cel25c/.test(s||'');
function findCards(data,raw,setFilter){
  const tokens=norm(raw).split(' ').filter(Boolean);
  const words=tokens.filter(x=>!/^\d+\/\d+$/.test(x)&&!/^\d+$/.test(x));
  const nums=tokens.filter(x=>/^\d+$/.test(x));
  const fracs=tokens.filter(x=>/^\d+\/\d+$/.test(x)).map(x=>x.split('/').map(Number));
  const phrase=words.join(' ');
  const out=[];
  for(const c of data.cards){
    if(setFilter&&c.s!==setFilter)continue;
    const st=data.sets[c.s];
    if(!c.k)c.k=norm(c.n);
    if(!c.h)c.h=c.k+' '+norm(st?.n)+' '+norm(st?.alt)+' '+norm(c.s)+' '+norm(c.l);
    if(words.length&&!words.every(w=>c.h.includes(w)))continue;
    const ln=parseInt(c.l,10);
    if(nums.length&&!nums.every(n=>ln===+n||c.h.split(' ').includes(n)))continue;
    if(fracs.length&&!fracs.every(([a,b])=>ln===a&&(st?.off===b||st?.tot===b)))continue;
    let score=0;
    if(phrase){if(c.k===phrase)score=3;else if(c.k.startsWith(phrase))score=2;else if(c.k.includes(phrase))score=1}
    out.push({c,st,score});
  }

    if(settings.hidePrices)return `<div class="sh-price safe">🛡 ${t('safe_prices')}</div>`;
    const p=priceFor(st.variant);
    const links=`<div class="sh-links"><a target="_blank" rel="noopener" href="${esc(ebayUrl(card.name,num,card.setName,'',lang,card.setId))}">eBay ↗</a><a target="_blank" rel="noopener" href="${esc(cmUrl(card.name,card.setName))}">Cardmarket ↗</a></div>`;
    if(!p)return `<div class="sh-price"><div class="sh-plab">${t('est_price')}</div><div class="muted" style="margin:6px 0 2px">${t('no_price')}</div><div class="sh-pfoot"><span></span>${links}</div></div>`;
    const own=copies().find(x=>x.variant===st.variant)||wishE();
    const hist=own?.hist?.length>=3?own.hist.map(h=>h.v):null;
    const series=hist||[p.avg30,p.avg7,p.avg1,p.trend];
    const sv=series.filter(v=>v>0);const chg=sv.length>=2?(sv[sv.length-1]-sv[0])/sv[0]*100:null;
    const r=priceRange(p);
    return `<div class="sh-price">
      <div class="sh-plab">${t('est_price')} · ${t('v_'+st.variant)}</div>
      <div class="sh-prow"><div><div class="sh-pval">${fmtEur(p.value)}</div>${chg!=null&&isFinite(chg)?`<div class="sh-pchg ${chg>=0?'pos':'neg'}">${chg>=0?'▲':'▼'} ${fmtPct(chg)} ${hist?t('since_track'):t('over_30d')}</div>`:''}</div>${sparkSvg(series)}</div>
      ${r&&r.min!==r.max?`<div class="sh-prange">${t('range_short')} ${fmtEur(r.min)} – ${fmtEur(r.max)} · Cardmarket</div>`:''}
      <details class="sh-pdet"${st.detOpen?' open':''}><summary><span>${t('price_detail')}</span>${links}</summary><div class="sh-pdet-in">${d?pricesBlock(d,st.variant):''}${own?.hist?.length>1&&window.Chart?`<b class="small">${t('history')}</b><div style="height:140px;position:relative;margin-top:6px"><canvas class="shchart"></canvas></div>`:''}</div></details>
    </div>`;
  }
  function copyRow(c){
    const v=entryValue(c),ch=c.buy>0&&v!=null?(v-c.buy)/c.buy*100:null;
    const sub=[c.buy?`<span class="money">${t('bought')} ${fmtEur(c.buy)}</span>`:'',c.date&&c.buy?t('on_date',{d:fmtDate(c.date)}):'',c.manual>0?`<span class="money">${t('manual_short')}</span>`:'',c.grade?.cert?`cert. ${esc(c.grade.cert)}`:'',c.alert?`🔔 <span class="money">${c.alert.dir==='below'?'≤':'≥'} ${fmtEur(c.alert.price)}</span>`:'',c.notes?esc(c.notes):''].filter(Boolean).join(' · ');
    return `<div class="sh-copy ${st.focus===c.uid?'focus':''} ${st.editing===c.uid?'open':''}" data-copy="${c.uid}">
      <div class="q">×${c.qty||1}</div>
      <div class="t"><div>${t('v_'+c.variant)} · ${esc(c.cond||'NM')}${c.grade?.co?` <span class="gbadge">${esc(gradeStr(c))}</span>`:''}</div>${sub?`<div>${sub}</div>`:''}</div>
      <div class="v money">${v!=null?fmtEur(v*(c.qty||1)):'—'}${ch!=null?`<small class="${ch>=0?'pos':'neg'}">${fmtPct(ch)}</small>`:c.manual>0?`<small>${t('manual_tag')}</small>`:''}</div>
      <button type="button" class="sh-edit" data-edit="${c.uid}" aria-label="${esc(t('edit'))}" title="${esc(t('edit'))}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg></button>
      <button type="button" class="sh-edit sh-del" data-qdel="${c.uid}" aria-label="${esc(t((c.qty||1)>1?'del_one':'delete'))}" title="${esc(t((c.qty||1)>1?'del_one':'delete'))}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
    </div>${st.editing===c.uid?editor(c):''}`;
  }
  function editor(c){
    const vs=[...new Set([...variants,c.variant])];
    return `<form class="sh-form sh-editor" data-ed="${c.uid}">
      <div class="sh-lbl">${t('variant')}</div>${pickSeg('variant',vs.map(v=>[v,t('v_'+v)]),c.variant)}
      <div class="sh-lbl">${t('condition')}</div>${pickPills('cond',c.cond||'NM')}
      <div class="sh-lbl">${t('qty')}</div>${pickQty(c.qty||1)}
      <details class="extra"${c.buy||c.notes?' open':''}><summary>📝 ${t('buy_notes')}</summary><div class="form" style="margin-top:6px">
        <label class="money">${t('buy_price')}<input type="number" name="buy" min="0" step="0.01" inputmode="decimal" value="${c.buy||''}"></label>
        <label>${t('buy_date')}<input type="date" name="date" value="${esc(c.date||'')}"></label>
        <label class="full">${t('notes')}<input type="text" name="notes" value="${esc(c.notes||'')}"></label></div></details>
      ${extraFields(c)}
      <div class="sh-edbtns"><button type="button" class="btn danger" data-del="${c.uid}">🗑 ${t('delete')}</button><span></span><button type="button" class="btn" data-cancel>${t('cancel')}</button><button type="submit" class="btn primary">${t('save')}</button></div>
    </form>`;
  }
  function addForm(){
    return `<form class="sh-form" id="shAdd">
      <div class="sh-lbl" style="margin-top:0">${t('variant')}</div>${pickSeg('variant',variants.map(v=>[v,t('v_'+v)]),st.variant)}
      <div class="sh-lbl">${t('condition')}</div>${pickPills('cond','NM')}
      <div class="sh-lbl">${t('qty')}</div>${pickQty(1)}
      <details class="extra"><summary>📝 ${t('buy_notes')}</summary><div class="form" style="margin-top:6px">
        <label class="money">${t('buy_price')}<input type="number" name="buy" min="0" step="0.01" inputmode="decimal" placeholder="0,00"></label>
        <label>${t('buy_date')}<input type="date" name="date" value="${today()}"></label>
        <label class="full">${t('notes')}<input type="text" name="notes"></label></div></details>
      ${extraFields()}
    </form>`;
  }
  function draw(){
    const cs=copies(),w=wishE(),nOwn=cs.reduce((a,x)=>a+(x.qty||1),0);
    const tot=cs.reduce((a,x)=>{const v=entryValue(x);return v!=null?a+v*(x.qty||1):a},0);
    const scroller=document.getElementById('ov'),keep=scroller?scroller.scrollTop:0;
    m.innerHTML=`<button class="iconbtn mclose" id="mclose" aria-label="close">✕</button>
    <div class="sh ${compact?'compact':''}">
      <div class="sh-hero"><div class="sh-imgw">${imgTag(card.image,card.setId,card.localId,card.name,'high','cimg sh-img',lang)}<button type="button" class="sh-zoom" aria-label="${esc(t('fs_open'))}" title="${esc(t('fs_open'))}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 4h5v5M9 20H4v-5M20 4l-6 6M4 20l6-6"/></svg></button></div></div>
      <div class="sh-main">
        <div class="sh-head"><div class="sh-hinfo">
        <h1 class="sh-name">${esc(card.name)} <span class="sh-flag">${FLAGS[lang]}</span></h1>
        <div class="sh-chips"><span class="sh-chip">${esc(card.setName)}</span><span class="sh-chip">${esc(num)}</span>${card.rarity?`<span class="sh-chip ${plainRarity.test(card.rarity)?'':'r'}">${plainRarity.test(card.rarity)?'':'★ '}${esc(card.rarity)}</span>`:''}${isReprintSet(card.setId)?`<span class="sh-chip r">♻ ${t('reprint_short')}</span>`:''}</div>
        ${card.illu?`<div class="sh-illu">${t('illustrator')} : ${esc(card.illu)}</div>`:''}
        </div></div>
        ${priceHero()}
        ${w?`<div class="sh-wish"><span>${HEART}${t('in_wish')}</span><button type="button" class="linkbtn" id="shAlert">🔔 ${w.alert?(settings.hidePrices?t('al_active'):`${w.alert.dir==='below'?'≤':'≥'} ${fmtEur(w.alert.price)}`):t('al_set')}</button></div>`:''}
        ${cs.length?`<div class="sh-sec">${t('my_copies')} (${nOwn})</div>${cs.map(copyRow).join('')}${tot?`<div class="sh-tot money"><span>${t('copies_value')}</span><b>${fmtEur(tot)}</b></div>`:''}`:''}
        ${st.addOpen?`<div class="sh-sec" id="shAddSec">${cs.length?t('add_copy'):t('add_btn')}</div>${addForm()}`:''}
      </div>
    </div>
    <div class="sheet-cta" ${st.editing?'hidden':''}>
      <button type="button" class="btn cta-wish ${w?'on':''}" id="shWish" ${!d&&!w?'disabled':''} aria-label="${esc(t(w?'wish_remove':'add_wish_btn'))}" title="${esc(t(w?'wish_remove':'add_wish_btn'))}">${HEART}<span class="cta-lbl">${t(w?'in_wish':'cta_wish')}</span></button>
      <button type="button" class="btn primary cta-add" id="shCta">＋ ${t(st.addOpen?'add_btn':'add_copy')}</button>
    </div>`;
    if(scroller)scroller.scrollTop=keep;
    bind();
  }
  function bind(){bindTop();bindRest()}
  function bindTop(){
    m.querySelector('#mclose').onclick=closeModal;
    const img=m.querySelector('.sh-img');const full=()=>openImageFull(imgTag(card.image,card.setId,card.localId,card.name,'high','fsimg',lang));
    m.querySelector('.sh-zoom').onclick=full;if(img)img.addEventListener('click',full);
    bindPrice();
    const al=m.querySelector('#shAlert');if(al)al.onclick=()=>openAlertSheet(wishE().uid);
  }
  function bindPrice(){
    const det=m.querySelector('.sh-pdet');
    det?.querySelectorAll('.sh-links a').forEach(a=>a.addEventListener('click',e=>e.stopPropagation()));
    if(det)det.addEventListener('toggle',()=>{st.detOpen=det.open;const cv=det.querySelector('.shchart');const own=copies().find(x=>x.variant===st.variant)||wishE();
      if(det.open&&cv&&!cv.dataset.on&&window.Chart&&own?.hist?.length>1){cv.dataset.on=1;charts.push(new Chart(cv,{type:'line',data:{labels:own.hist.map(h=>fmtDate(h.d)),datasets:[{data:own.hist.map(h=>h.v),borderColor:getCss('--accent'),backgroundColor:'transparent',tension:.3,pointRadius:2}]},options:chartOpts(false)}))}});
  }
  function bindRest(){
    // copies: edit inline
    m.querySelectorAll('[data-edit]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();st.editing=st.editing===b.dataset.edit?null:b.dataset.edit;st.focus=null;draw();m.querySelector('.sh-editor')?.scrollIntoView({block:'nearest',behavior:'smooth'})});
    m.querySelectorAll('[data-copy]').forEach(r=>r.onclick=()=>r.querySelector('[data-edit]').click());
    m.querySelectorAll('[data-qdel]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();delCopy(b.dataset.qdel,true)});
    const ed=m.querySelector('.sh-editor');
    if(ed){
      bindPickers(ed);
      ed.querySelector('[data-cancel]').onclick=()=>{st.editing=null;draw()};
      ed.querySelector('[data-del]').onclick=()=>delCopy(ed.dataset.ed);
      ed.onsubmit=async ev=>{
        ev.preventDefault();
        const c=collection.find(x=>x.uid===ed.dataset.ed);if(!c)return;
        const variantChanged=ed.variant.value!==c.variant;
        Object.assign(c,{variant:ed.variant.value,cond:ed.cond.value,qty:Math.max(1,parseInt(ed.qty.value)||1),buy:parseFloat(String(ed.buy.value).replace(',','.'))||0,date:ed.date.value,notes:ed.notes.value.trim(),upd:Date.now(),...readExtra(ed,c)});
        if(variantChanged){const p=priceFor(c.variant);if(p){c.price=p;pushHistory(c)}}
        saveCollection();render();st.editing=null;draw();
        const hits=checkAlerts(false);toast(hits.length?'🔔 '+t('alert_toast',{n:hits.length}):t('saved'));
      };
    }
    // add form
    const f=m.querySelector('#shAdd');
    if(f){bindPickers(f);f.addEventListener('pick',e=>{if(e.detail.name==='variant'){st.variant=e.detail.val;const ph=m.querySelector('.sh-price');if(ph){ph.outerHTML=priceHero();bindPrice()}}});f.onsubmit=ev=>{ev.preventDefault();addNow()}}
    m.querySelector('#shCta').onclick=()=>{
      if(!st.addOpen){st.addOpen=true;st.editing=null;draw();const sec=m.querySelector('#shAddSec');sec?.scrollIntoView({block:'start',behavior:'smooth'});return}
      addNow();
    };
    m.querySelector('#shWish').onclick=()=>{
      const w=wishE();
      if(w){deleted[w.uid]=Date.now();LS.set('pf_deleted',deleted);collection=collection.filter(x=>x!==w);saveCollection();render();draw();
        toast(t('wish_removed',{n:card.name}),{label:t('undo'),fn:()=>{delete deleted[w.uid];LS.set('pf_deleted',deleted);w.upd=Date.now();collection.push(w);saveCollection();render();if(m.isConnected)draw()}});return}
      if(!d)return;
      collection.push(entryFromDetail(d,lang,{status:'wish',variant:st.variant}));saveCollection();render();draw();toast(t('wish_added',{n:card.name}));
    };
  }
  function delCopy(cid,one){
    const c=collection.find(x=>x.uid===cid);if(!c)return;
    // trash icon on a ×2+ line removes a single copy; the editor's Delete button removes the whole line
    if(one&&(c.qty||1)>1){c.qty--;c.upd=Date.now();saveCollection();render();draw();
      toast(t('deleted_one',{n:card.name}),{label:t('undo'),fn:()=>{c.qty++;c.upd=Date.now();saveCollection();render();if(m.isConnected)draw()}});return}
    deleted[c.uid]=Date.now();LS.set('pf_deleted',deleted);collection=collection.filter(x=>x!==c);saveCollection();render();
    st.editing=null;if(!copies().length)st.addOpen=true;draw();
    toast(t('deleted_n',{n:card.name}),{label:t('undo'),fn:()=>{delete deleted[c.uid];LS.set('pf_deleted',deleted);c.upd=Date.now();collection.push(c);saveCollection();render();if(m.isConnected){st.addOpen=false;draw()}}});
  }
  function addNow(){
    const f=m.querySelector('#shAdd');if(!f)return;
    const variant=f.variant.value;
    const e={uid:uid(),cardId:id,lang,name:card.name,setId:card.setId,setName:card.setName,localId:card.localId,official:card.off||null,
      rarity:card.rarity,image:card.image,variant,cond:f.cond.value,qty:Math.max(1,parseInt(f.qty.value)||1),
      buy:parseFloat(String(f.buy.value).replace(',','.'))||0,date:f.date.value,status:'owned',notes:f.notes.value.trim(),added:Date.now(),
      price:priceFor(variant),tcp:d?.pricing?.tcgplayer||null,hist:[],upd:Date.now(),...readExtra(f)};
    pushHistory(e);
    const plain=x=>!x.buy&&!x.grade&&!x.manual&&!x.alert&&!x.notes;
    const same=plain(e)&&collection.find(x=>x.cardId===e.cardId&&x.lang===e.lang&&x.variant===e.variant&&x.cond===e.cond&&x.status==='owned'&&plain(x));
    if(same){same.qty+=e.qty;same.price=e.price;same.upd=Date.now();pushHistory(same)}else collection.push(e);
    // got it: the card leaves the wishlist
    const w=wishE();let msg=t('added',{n:card.name});
    if(w){deleted[w.uid]=Date.now();LS.set('pf_deleted',deleted);collection=collection.filter(x=>x!==w);msg=t('added_from_wish',{n:card.name})}
    saveCollection();closeModal();render();toast(msg);
    if(checkAlerts(false).length)toast('🔔 '+t('alert_toast',{n:1}));
  }
  draw();
}
const getCss=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function chartOpts(legend){
  const c=getCss('--muted'),g=getCss('--line');
  return{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:legend,labels:{color:c}},tooltip:{callbacks:{label:x=>(x.dataset.label?x.dataset.label+' : ':'')+fmtEur(x.parsed.y)}}},
    scales:{x:{ticks:{color:c,maxTicksLimit:8},grid:{color:g}},y:{ticks:{color:c,callback:v=>fmtEur(v)},grid:{color:g}}}};
}

/* ============ view: wishlist ============ */
function viewWish(m){
  const list=collection.filter(e=>e.status==='wish').sort((a,b)=>(entryValue(b)||0)-(entryValue(a)||0));
  const total=list.reduce((s,e)=>s+(entryValue(e)||0)*e.qty,0);
  m.innerHTML=`<h1>${t('wish_title')}</h1>
  ${alertsBanner(e=>e.status==='wish')}
  ${list.length?`<div class="stat wbudget money"><div class="lbl">${t('wish_budget')}</div><div class="val">${fmtEur(total)}</div><div class="sub">${t('wish_count',{n:list.reduce((a,e)=>a+(e.qty||1),0)})}</div></div><div class="grid">${list.map(e=>entryTile(e,{remove:true,bell:true})).join('')}</div>`:`<div class="empty">${t('wish_empty')}</div>`}`;
  m.querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>openEntry(el.dataset.uid));
  m.querySelectorAll('[data-bell]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();openAlertSheet(b.dataset.bell)});
  m.querySelectorAll('[data-x]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const e=collection.find(x=>x.uid===b.dataset.x);if(!e)return;
    deleted[e.uid]=Date.now();LS.set('pf_deleted',deleted);
    collection=collection.filter(x=>x!==e);saveCollection();render();
    toast(t('wish_removed',{n:e.name}),{label:t('undo'),fn:()=>{delete deleted[e.uid];LS.set('pf_deleted',deleted);e.upd=Date.now();collection.push(e);saveCollection();render()}});
  });
  m.querySelectorAll('.alerts [data-open]').forEach(el=>el.onclick=()=>openEntry(el.dataset.open));
  bindAlerts(m,e=>e.status==='wish');
}

  if(!owned.length){m.innerHTML=`<h1>${t('evo_title')}</h1><div class="empty"><p>${t('empty_collection')}</p><a class="btn primary" href="#add">＋ ${t('go_add')}</a></div>`;return}

  const li=(e,right)=>`<div class="li" data-open="${e.uid}"><span style="width:38px;flex:none">${imgTag(e.image,e.setId,e.localId,'','low','',e.lang)}</span><div class="grow"><div><b>${esc(e.name)}</b>${e.qty>1?` <span class="muted small">×${e.qty}</span>`:''}</div><div class="muted small">${esc(e.setName)} · ${esc(numLabel(e.localId,e.official))}</div></div>${right}</div>`;
  m.innerHTML=`<h1>${t('evo_title')}</h1>
  <div class="stats">
    <div class="stat"><div class="lbl">${t('stat_value')}</div><div class="val">${fmtEur(tt.value)}</div><div class="sub">${settings.lastRefresh?t('updated_at',{d:fmtDate(settings.lastRefresh)}):''}</div></div>
    <div class="stat"><div class="lbl">${t('stat_cards')}</div><div class="val">${tt.count}</div><div class="sub">${t('unique_cards',{n:tt.unique})}</div></div>
    <div class="stat"><div class="lbl">${t('stat_cost')}</div><div class="val">${fmtEur(tt.cost)}</div><div class="sub">${t('gain_on',{n:tt.withCost})}</div></div>
    <div class="stat"><div class="lbl">${t('stat_gain')}</div><div class="val ${tt.withCost?gainCls:''}">${tt.withCost?(settings.hidePrices?'':tt.gain>=0?'+':'')+fmtEur(tt.gain):'—'}</div><div class="sub ${gainCls}">${tt.withCost?fmtPct(tt.gainPct):''}</div></div>
  </div>
  <div class="toolbar" style="justify-content:flex-end;margin:10px 0 4px"><button class="btn" id="refreshBtn">↻ ${t('refresh')}</button></div>
  <h2>${t('evo_chart')}</h2>
  ${settings.hidePrices?`<div class="empty small">🙈 ${t('priv_chart')}</div>`:snapshots.length>1?`<div class="panel"><div class="chartbox"><canvas id="evo"></canvas></div></div>`:`<div class="empty small">${t('evo_empty')}</div>`}
  <div class="two" style="margin-top:16px">
    <div class="panel"><b>${t('top_cards')}</b><div class="list">${top.map(e=>li(e,`<b>${fmtEur(entryValue(e)*e.qty)}</b>`)).join('')}</div></div>
    <div class="panel"><b>${t('movers')}</b>${movers.length?`<div class="list">${movers.map(x=>li(x.e,`<b class="${x.c>=0?'pos':'neg'}">${fmtPct(x.c)}</b>`)).join('')}</div>`:`<p class="muted small">${t('no_movers')}</p>`}</div>
    <div class="panel"><b>${t('by_set')}</b>${bars(group(e=>e.setName).slice(0,8))}</div>
    <div class="panel"><b>${t('by_lang')}</b>${bars(group(e=>e.lang),l=>`${FLAGS[l]?`<span class="lflag">${FLAGS[l]}</span>`:''}${esc(LANG_NAMES[l]||l)}`)}</div>
  </div>`;
  m.querySelector('#refreshBtn').onclick=()=>refreshPrices();
  m.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openEntry(el.dataset.open));
  if(!settings.hidePrices&&snapshots.length>1&&window.Chart){
    charts.push(new Chart(m.querySelector('#evo'),{type:'line',data:{labels:snapshots.map(s=>fmtDate(s.d)),datasets:[
      {label:t('value'),data:snapshots.map(s=>s.value),borderColor:getCss('--accent'),backgroundColor:'transparent',tension:.25,pointRadius:2},
      {label:t('cost'),data:snapshots.map(s=>s.cost),borderColor:getCss('--muted'),borderDash:[5,4],backgroundColor:'transparent',tension:.25,pointRadius:0}]},options:chartOpts(true)}));
  }
}

/* ============ view: data ============ */
function download(name,content,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function viewData(m){
  const ic={
    account:'<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
    display:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>',
    backup:'<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
    alerts:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    advanced:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'
  };
  const sec=(k,title,body)=>`<section class="spanel"><h2 class="shead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic[k]}</svg>${title}</h2>${body}</section>`;
  const row=(title,desc,ctl)=>`<div class="srow"><div class="sinfo"><div class="stitle">${title}</div>${desc?`<div class="sdesc">${desc}</div>`:''}</div><div class="sctl">${ctl}</div></div>`;
  const seg=(name,cur,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button type="button" data-${name}="${v}" class="${cur===v?'on':''}">${l}</button>`).join('')}</div>`;
  const nCards=collection.filter(e=>e.status!=='wish').reduce((a,e)=>a+(e.qty||1),0);
  m.innerHTML=`<h1>${t('data_title')}</h1>
  ${sec('account',t('account'),row(
      user?`<span class="acc-av" style="display:inline-grid;margin-right:8px;vertical-align:middle">${esc((user.email||'?')[0].toUpperCase())}</span>${esc(user.email)}`:t('not_logged'),
      user?`<span id="syncInfo">${syncLabel()}</span>`:t('account_why'),
      `<button class="btn ${user?'':'primary'}" id="accOpen">${user?t('manage'):t('login')}</button>`))}
  ${sec('display',t('display'),
      row(t('lang_label'),'',seg('lang',settings.lang,[['fr',FLAGS.fr+' Français'],['en',FLAGS.en+' English']]))+
      row(t('theme_label'),'',seg('theme',settings.theme,[['dark',t('theme_dark')],['light',t('theme_light')]]))+
      row(t('pill_size'),'',pillControl(false))+
      row(t('priv_t'),t('priv_d'),seg('priv',settings.hidePrices?'1':'0',[['0',t('priv_shown')],['1',t('priv_hidden')]])))}
  ${sec('backup',t('sec_backup'),`<p class="snote">${user?t('data_note_cloud'):t('data_note')}</p>`+
      row(t('exp_json_t'),t('exp_json_d',{n:nCards}),`<button class="btn primary" id="exJson">${t('btn_export')}</button>`)+
      row(t('imp_t'),t('imp_d'),`<label class="btn">${t('btn_import')}<input type="file" id="imp" accept=".json,application/json" hidden></label>`)+
      row(t('exp_csv_t'),t('exp_csv_d'),`<button class="btn" id="exCsv">${t('btn_export')}</button>`))}
  ${sec('alerts',t('sec_alerts'),row(t('notif_t'),t('notif_d')+' <span id="notifState"></span>',`<button class="btn" id="notif">${t('btn_enable')}</button>`))}
  ${sec('advanced',t('sec_advanced'),row(t('reload_t'),t('reload_d'),`<button class="btn" id="clr">${t('btn_reload')}</button>`))}
  <section class="spanel about">
    <div class="ab-head"><span class="ab-logo">${document.querySelector('.logo svg')?.outerHTML||''}</span><div><div class="ab-name">Gleamvault</div><div class="sdesc">${t('about_tag')} · v${APP_VERSION}</div></div></div>
    <dl class="ab-list">
      <div><dt>${t('ab_cards')}</dt><dd><a href="https://tcgdex.dev" target="_blank" rel="noopener">TCGdex</a>${(()=>{const L=['fr','en','ja'].filter(l=>idx[l]);return L.length?`<div class="muted" style="font-size:11.5px">${L.map(l=>`${FLAGS[l]} ${t('ab_ncards',{n:idx[l].cards.length.toLocaleString()})}`).join(' · ')}</div>`:''})()}</dd></div>
      <div><dt>${t('ab_prices')}</dt><dd>Cardmarket · TCGplayer<div class="muted" style="font-size:11.5px">${t('ab_daily')}</div></dd></div>
      <div><dt>${t('ab_images')}</dt><dd>TCGdex · Scrydex</dd></div>
      <div><dt>${t('ab_scan')}</dt><dd>Tesseract.js</dd></div>
    </dl>
    <p class="ab-legal">${t('ab_legal')}</p>
  </section>`;
  m.querySelectorAll('button[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  m.querySelectorAll('button[data-theme]').forEach(b=>b.onclick=()=>{settings.theme=b.dataset.theme;saveSettings();render()});
  m.querySelectorAll('button[data-priv]').forEach(b=>b.onclick=()=>setPriv(b.dataset.priv==='1'));
  m.querySelector('#exJson').onclick=()=>download(`gleamvault-${today()}.json`,JSON.stringify({app:'gleamvault',version:1,exported:new Date().toISOString(),collection,snapshots},null,1),'application/json');
  m.querySelector('#exCsv').onclick=()=>{
    const cols=['name','setName','localId','official','lang','variant','cond','grade','cert','qty','status','buy','date','value','manual','notes'];
    const rows=collection.map(e=>cols.map(c=>{const v=c==='value'?(entryValue(e)??''):c==='grade'?gradeStr(e):c==='cert'?(e.grade?.cert||''):e[c]??'';return '"'+String(v).replace(/"/g,'""')+'"'}).join(';'));
    download(`gleamvault-${today()}.csv`,'﻿'+cols.join(';')+'\n'+rows.join('\n'),'text/csv');
  };
  m.querySelector('#imp').onchange=async ev=>{
    const file=ev.target.files[0];if(!file)return;
    try{
      const data=JSON.parse(await file.text());
      const list=Array.isArray(data)?data:data.collection;
      if(!Array.isArray(list)||list.some(e=>!e.cardId||!e.name))throw 0;
      if(collection.length&&!(await confirmBox(t('import_confirm',{a:collection.length,b:list.length}))))return;
      const now=Date.now();collection.forEach(x=>{deleted[x.uid]=now});LS.set('pf_deleted',deleted);
      collection=list.map(e=>Object.assign({uid:uid(),qty:1,status:'owned',variant:'normal',cond:'NM',lang:'fr',added:Date.now(),hist:[]},e,{upd:now+1}));
      if(Array.isArray(data.snapshots))snapshots=data.snapshots;
      LS.set('pf_snapshots',snapshots);saveCollection();toast(t('import_ok',{n:collection.length}));render();
    }catch(e){toast(t('import_bad'))}
  };
  m.querySelector('#accOpen').onclick=()=>openAccount();
  bindPill(m);
  const ns=m.querySelector('#notifState');
  const showN=()=>{ns.textContent='Notification' in window?(Notification.permission==='granted'?'· ✓ '+t('notif_on'):Notification.permission==='denied'?'· '+t('notif_off'):''):'· '+t('notif_off')};showN();
  m.querySelector('#notif').onclick=async()=>{try{await Notification.requestPermission()}catch(_){}showN()};
  m.querySelector('#clr').onclick=async()=>{idx.fr=idx.en=null;loading.fr=loading.en=null;await loadIndex(settings.cardLang,true).catch(()=>{});toast(t('cache_cleared'))};
}

/* ============ boot ============ */
initSupabase();
route();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
loadIndex(settings.cardLang).then(()=>{if(syncEntrySetNames()&&!document.querySelector('.ov'))render()}).catch(()=>{});
if(collection.length&&Date.now()-settings.lastRefresh>AUTO_REFRESH)refreshPrices(true);
</script>
</body>
</html>
